/* =========================
   LOAD DATA
========================= */

function loadRecipes(){

  try{

    const saved =
      localStorage.getItem("dapurKapalRecipes");

    if(saved){

      const parsed = JSON.parse(saved);

      if(Array.isArray(parsed) && parsed.length>0){
        return parsed;
      }

    }

  }catch(error){

    console.log("Data resep lama tidak bisa dibaca.");

  }

  return defaultRecipes;

}


function loadFavorites(){

  try{

    const saved =
      localStorage.getItem("dapurKapalFavorites");

    if(saved){

      const parsed = JSON.parse(saved);

      if(Array.isArray(parsed)){
        return parsed;
      }

    }

  }catch(error){

    console.log("Data favorit tidak bisa dibaca.");

  }

  return [];

}

let editingId = null;

/* =========================
   HTML SAFETY
========================= */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeImage(url){

  if(!url){
    return "https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80";
  }

  return escapeHTML(url);

}


/* =========================
   TAKARAN
========================= */

function scaleText(text,crew){

  if(!text){
    return "";
  }

  if(
    text.toLowerCase().includes("secukupnya") ||
    text.toLowerCase().includes("sesuai selera")
  ){
    return text;
  }

  return text.replace(
    /(\d+(?:[.,]\d+)?)\s*(kg|liter|ml|gram|g|sdm|sdt|buah|butir|siung|batang|ruas|lembar)/gi,
    function(match,num,unit){

      let value =
        parseFloat(String(num).replace(",","."));

      let scaled =
        value * (crew / 9);

      let rounded =
        Math.round(scaled * 10) / 10;

      return rounded + " " + unit;

    }
  );

}


/* =========================
   RENDER
========================= */

function renderRecipes(){

  const grid =
    document.getElementById("recipeGrid");

  const search =
    document.getElementById("search")
    .value
    .trim()
    .toLowerCase();

  const crew =
    parseInt(
      document.getElementById("crew").value
    ) || 9;


  let filtered = recipes.filter(recipe=>{

    const categoryMatch =
      currentCategory === "Semua" ||
      recipe.category === currentCategory;


    const text =
      [
        recipe.name,
        recipe.category,
        ...(recipe.ingredients || [])
      ]
      .join(" ")
      .toLowerCase();


    const searchMatch =
      text.includes(search);


    const favoriteMatch =
      !showingFavorites ||
      favorites.includes(recipe.id);


    return (
      categoryMatch &&
      searchMatch &&
      favoriteMatch
    );

  });


  if(filtered.length === 0){

    grid.innerHTML = `
      <div class="empty">
        😔<br><br>
        Tidak ada resep yang ditemukan.
      </div>
    `;

    return;

  }


  grid.innerHTML =
    filtered.map(recipe=>{

      const isFavorite =
        favorites.includes(recipe.id);


      const customButtons =
        recipe.custom
        ? `
          <button
            class="btn-secondary edit-btn"
            data-id="${recipe.id}"
          >
            ✏️
          </button>

          <button
            class="btn-secondary delete-btn"
            data-id="${recipe.id}"
          >
            🗑️
          </button>
        `
        : "";


      return `
        <div class="card">

          <img
            class="card-img"
            src="${safeImage(recipe.image)}"
            onerror="this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80'"
          >

          <button
            class="favorite favorite-btn"
            data-id="${recipe.id}"
          >
            ${isFavorite ? "❤️" : "🤍"}
          </button>


          <div class="card-content">

            <h3>
              ${escapeHTML(recipe.name)}
            </h3>

            <div class="meta">
              ${escapeHTML(recipe.category)}
              • ⏱️ ${escapeHTML(recipe.time || "-")}
              • 👥 ${crew} orang
            </div>


            <div class="card-buttons">

              <button
                class="btn view-btn"
                data-id="${recipe.id}"
              >
                👀 Lihat
              </button>


              <button
                class="btn-secondary shop-btn"
                data-id="${recipe.id}"
              >
                🛒
              </button>


              <button
                class="btn-secondary cook-btn"
                data-id="${recipe.id}"
              >
                🔥
              </button>


              ${customButtons}

            </div>

          </div>

        </div>
      `;

    }).join("");


  attachCardEvents();

}


/* =========================
   CARD EVENTS
========================= */

function attachCardEvents(){

  document
    .querySelectorAll(".view-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        function(){

          showRecipe(
            Number(this.dataset.id)
          );

        }
      );

    });


  document
    .querySelectorAll(".favorite-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        function(){

          toggleFavorite(
            Number(this.dataset.id)
          );

        }
      );

    });


  document
    .querySelectorAll(".shop-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        function(){

          openShopping(
            Number(this.dataset.id)
          );

        }
      );

    });


  document
    .querySelectorAll(".cook-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        function(){

          startCooking(
            Number(this.dataset.id)
          );

        }
      );

    });


  document
    .querySelectorAll(".edit-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        function(){

          editRecipe(
            Number(this.dataset.id)
          );

        }
      );

    });


  document
    .querySelectorAll(".delete-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        function(){

          deleteRecipe(
            Number(this.dataset.id)
          );

        }
      );

    });

}


/* =========================
   FILTER
========================= */

function setCategory(category){

  currentCategory = category;

  showingFavorites = false;

  document
    .querySelectorAll(".categories button")
    .forEach(button=>{

      button.classList.toggle(
        "active",
        button.dataset.category === category
      );

    });

  renderRecipes();

}


document
  .querySelectorAll(".categories button")
  .forEach(button=>{

    button.addEventListener(
      "click",
      function(){

        setCategory(
          this.dataset.category
        );

      }
    );

  });


/* =========================
   SEARCH
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderRecipes
  );


document
  .getElementById("crew")
  .addEventListener(
    "input",
    renderRecipes
  );


/* =========================
   DETAIL
========================= */

function showRecipe(id){

  const recipe =
    recipes.find(r=>r.id===id);

  if(!recipe){
    return;
  }


  const crew =
    parseInt(
      document.getElementById("crew").value
    ) || 9;


  const ingredients =
    (recipe.ingredients || [])
      .map(item=>`
        <li>
          ${escapeHTML(
            scaleText(item,crew)
          )}
        </li>
      `)
      .join("");


  const steps =
    (recipe.steps || [])
      .map((step,index)=>`
        <li>
          <b>Langkah ${index+1}</b><br>
          ${escapeHTML(step)}
        </li>
      `)
      .join("");


  document
    .getElementById("detailContent")
    .innerHTML = `

      <h2>
        ${escapeHTML(recipe.name)}
      </h2>

      <img
        class="modal-img"
        src="${safeImage(recipe.image)}"
        onerror="this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80'"
      >

      <p>
        🍽️ Kategori:
        <b>${escapeHTML(recipe.category)}</b>
      </p>

      <p>
        ⏱️ Waktu:
        <b>${escapeHTML(recipe.time || "-")}</b>
      </p>

      <p>
        👥 Untuk:
        <b>${crew} orang</b>
      </p>


      <div class="section">

        <h3>🥘 Bahan</h3>

        <ul class="ingredients">
          ${ingredients}
        </ul>

      </div>


      <div class="section">

        <h3>👨‍🍳 Cara Memasak</h3>

        <ol class="steps">
          ${steps}
        </ol>

      </div>


      <div class="section">

        <button
          class="btn"
          id="detailShopBtn"
        >
          🛒 Daftar Belanja
        </button>

        <button
          class="btn"
          id="detailCookBtn"
        >
          🔥 Mulai Masak
        </button>

      </div>

    `;


  document
    .getElementById("detailShopBtn")
    .addEventListener(
      "click",
      function(){

        openShopping(id);

      }
    );


  document
    .getElementById("detailCookBtn")
    .addEventListener(
      "click",
      function(){

        startCooking(id);

      }
    );


  openModal("detailModal");

}


/* =========================
   FAVORIT
========================= */

function toggleFavorite(id){

  if(favorites.includes(id)){

    favorites =
      favorites.filter(
        item=>item!==id
      );

  }else{

    favorites.push(id);

  }


  saveData();

  renderRecipes();

}


function showFavorites(){

  showingFavorites = true;

  currentCategory = "Semua";

  document
    .querySelectorAll(".categories button")
    .forEach(button=>{
      button.classList.remove("active");
    });

  renderRecipes();

}


/* =========================
   TAMBAH RESEP
========================= */

document
  .getElementById("addRecipeBtn")
  .addEventListener(
    "click",
    openAddRecipe
  );


function clearForm(){

  document.getElementById("recipeName").value="";
  document.getElementById("recipeCategory").value="Ikan";
  document.getElementById("recipeImage").value="";
  document.getElementById("recipeTime").value="";
  document.getElementById("recipeIngredients").value="";
  document.getElementById("recipeSteps").value="";

}


function openAddRecipe(){

  editingId = null;

  document
    .getElementById("formTitle")
    .innerText =
      "➕ Tambah Resep";

  clearForm();

  openModal("formModal");

}


/* =========================
   EDIT
========================= */

function editRecipe(id){

  const recipe =
    recipes.find(r=>r.id===id);

  if(!recipe){
    return;
  }


  editingId = id;


  document
    .getElementById("formTitle")
    .innerText =
      "✏️ Edit Resep";


  document
    .getElementById("recipeName")
    .value =
      recipe.name || "";


  document
    .getElementById("recipeCategory")
    .value =
      recipe.category || "Ikan";


  document
    .getElementById("recipeImage")
    .value =
      recipe.image || "";


  document
    .getElementById("recipeTime")
    .value =
      recipe.time || "";


  document
    .getElementById("recipeIngredients")
    .value =
      (recipe.ingredients || []).join("\n");


  document
    .getElementById("recipeSteps")
    .value =
      (recipe.steps || []).join("\n");


  openModal("formModal");

}


/* =========================
   SIMPAN RESEP
========================= */

document
  .getElementById("saveRecipeBtn")
  .addEventListener(
    "click",
    saveRecipe
  );


function saveRecipe(){

  const name =
    document
      .getElementById("recipeName")
      .value
      .trim();


  const category =
    document
      .getElementById("recipeCategory")
      .value;


  const image =
    document
      .getElementById("recipeImage")
      .value
      .trim();


  const time =
    document
      .getElementById("recipeTime")
      .value
      .trim();


  const ingredients =
    document
      .getElementById("recipeIngredients")
      .value
      .split("\n")
      .map(item=>item.trim())
      .filter(Boolean);


  const steps =
    document
      .getElementById("recipeSteps")
      .value
      .split("\n")
      .map(item=>item.trim())
      .filter(Boolean);


  if(!name){

    alert(
      "⚠️ Nama resep wajib diisi."
    );

    return;

  }


  if(ingredients.length===0){

    alert(
      "⚠️ Bahan resep wajib diisi."
    );

    return;

  }


  if(steps.length===0){

    alert(
      "⚠️ Langkah memasak wajib diisi."
    );

    return;

  }


  const recipeData = {

    name:name,

    category:category,

    image:image || "https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80",

    time:time || "-",

    ingredients:ingredients,

    steps:steps

  };


  if(editingId !== null){

    const index =
      recipes.findIndex(
        r=>r.id===editingId
      );


    if(index !== -1){

      recipes[index] = {
        ...recipes[index],
        ...recipeData
      };

    }

  }else{

    recipes.push({

      id:Date.now(),

      ...recipeData,

      custom:true

    });

  }


  saveData();

  closeModal("formModal");

  renderRecipes();

  alert(
    editingId !== null
    ? "✅ Resep berhasil diperbarui!"
    : "✅ Resep berhasil ditambahkan!"
  );


  editingId = null;

}


/* =========================
   DELETE
========================= */

function deleteRecipe(id){

  const recipe =
    recipes.find(r=>r.id===id);

  if(!recipe){
    return;
  }


  const confirmed =
    confirm(
      'Hapus resep "' +
      recipe.name +
      '"?'
    );


  if(!confirmed){
    return;
  }


  recipes =
    recipes.filter(
      r=>r.id!==id
    );


  favorites =
    favorites.filter(
      idItem=>idItem!==id
    );


  saveData();

  renderRecipes();

  alert(
    "🗑️ Resep berhasil dihapus."
  );

}


/* =========================
   SHOPPING
========================= */

function openShopping(id){

  const recipe =
    recipes.find(r=>r.id===id);

  if(!recipe){
    return;
  }


  const crew =
    parseInt(
      document.getElementById("crew").value
    ) || 9;


  const list =
    document.getElementById("shoppingList");


  list.innerHTML =
    (recipe.ingredients || [])
      .map((item,index)=>`

        <label class="shop-item">

          <input
            type="checkbox"
            id="shop-${index}"
          >

          <span>
            ${escapeHTML(
              scaleText(item,crew)
            )}
          </span>

        </label>

      `)
      .join("");


  openModal("shopModal");

}


/* =========================
   COOKING MODE
========================= */

function startCooking(id){

  const recipe =
    recipes.find(r=>r.id===id);

  if(!recipe){
    return;
  }


  cookingSteps =
    Array.isArray(recipe.steps)
    ? recipe.steps
    : [];


  if(cookingSteps.length===0){

    alert(
      "⚠️ Resep ini belum memiliki langkah memasak."
    );

    return;

  }


  cookingIndex = 0;

  openModal("cookModal");

  updateCooking();

}


function updateCooking(){

  if(cookingSteps.length===0){
    return;
  }


  const current =
    cookingSteps[cookingIndex];


  document
    .getElementById("cookStep")
    .innerHTML = `

      <div style="font-size:14px;opacity:.7">
        Langkah ${cookingIndex+1}
        dari ${cookingSteps.length}
      </div>

      <br>

      ${escapeHTML(current)}

    `;


  const percent =
    ((cookingIndex+1) /
    cookingSteps.length) * 100;


  document
    .getElementById("progressBar")
    .style.width =
      percent + "%";


  document
    .getElementById("previousBtn")
    .disabled =
      cookingIndex === 0;


  document
    .getElementById("nextBtn")
    .innerText =
      cookingIndex === cookingSteps.length-1
      ? "✅ Selesai"
      : "Berikutnya ➡️";

}


document
  .getElementById("nextBtn")
  .addEventListener(
    "click",
    nextStep
  );


document
  .getElementById("previousBtn")
  .addEventListener(
    "click",
    previousStep
  );


function nextStep(){

  if(
    cookingIndex <
    cookingSteps.length-1
  ){

    cookingIndex++;

    updateCooking();

  }else{

    alert(
      "🎉 Masakan selesai! Selamat makan, crew!"
    );

    closeModal("cookModal");

  }

}


function previousStep(){

  if(cookingIndex>0){

    cookingIndex--;

    updateCooking();

  }

}


/* =========================
   MODAL
========================= */

function openModal(id){

  const modal =
    document.getElementById(id);

  if(modal){
    modal.style.display="block";
  }

}


function closeModal(id){

  const modal =
    document.getElementById(id);

  if(modal){
    modal.style.display="none";
  }

}


document
  .querySelectorAll("[data-close]")
  .forEach(button=>{

    button.addEventListener(
      "click",
      function(){

        closeModal(
          this.dataset.close
        );

      }
    );

  });


window.addEventListener(
  "click",
  function(event){

    document
      .querySelectorAll(".modal")
      .forEach(modal=>{

        if(event.target === modal){

          modal.style.display="none";

        }

      });

  }
);


/* =========================
   DARK MODE
========================= */

function applyDarkMode(){

  const isDark =
    localStorage.getItem(
      "dapurKapalDark"
    ) === "true";


  document.body.classList.toggle(
    "dark",
    isDark
  );

}


document
  .getElementById("darkBtn")
  .addEventListener(
    "click",
    function(){

      const isDark =
        document.body.classList.toggle("dark");


      localStorage.setItem(
        "dapurKapalDark",
        isDark
      );

    }
  );


/* =========================
   NAVIGATION BUTTONS
========================= */

document
  .getElementById("favoriteBtn")
  .addEventListener(
    "click",
    showFavorites
  );


document
  .getElementById("allBtn")
  .addEventListener(
    "click",
    function(){

      showingFavorites=false;

      currentCategory="Semua";

      document
        .querySelectorAll(".categories button")
        .forEach(button=>{

          button.classList.toggle(
            "active",
            button.dataset.category === "Semua"
          );

        });

      renderRecipes();

    }
  );


/* =========================
   START
========================= */

applyDarkMode();

renderRecipes();

</script>
