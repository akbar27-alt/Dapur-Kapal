<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dapur Kapal V10</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
body.dark{
  background:#121212;
  color:#eee;
}
header{
  background:#0d6efd;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0 0 6px}
.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  margin:4px;
  cursor:pointer;
  background:#0d6efd;
  color:white;
  font-weight:bold;
}
button.secondary{background:#6c757d}
button.success{background:#198754}
button.danger{background:#dc3545}
button.warning{background:#ffc107;color:#111}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:9px;
  margin:5px 0 10px;
}
textarea{min-height:90px}

.card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}
.dark .card{
  background:#1f1f1f;
  box-shadow:none;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}
.recipe{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
}
.dark .recipe{border-color:#444}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  background:#e9ecef;
  font-size:12px;
  margin:2px;
}
.dark .badge{
  background:#333;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:1000;
  padding:15px;
  overflow:auto;
}
.modal-box{
  max-width:850px;
  margin:30px auto;
  background:white;
  border-radius:15px;
  padding:18px;
}
.dark .modal-box{background:#1f1f1f}

.close{
  float:right;
  background:#dc3545;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:9px;
  text-align:left;
}
.dark th,.dark td{border-color:#444}

.good{color:#198754;font-weight:bold}
.bad{color:#dc3545;font-weight:bold}
.warn{color:#d39e00;font-weight:bold}

.stat{
  text-align:center;
  padding:15px;
  border-radius:12px;
  background:#e9f2ff;
}
.dark .stat{background:#26364a}

.big{
  font-size:22px;
  font-weight:bold;
}

@media print{
  body *{visibility:hidden}
  #reportModal,#reportModal *{visibility:visible}
  #reportModal{
    position:absolute;
    left:0;
    top:0;
    background:white;
    color:black;
  }
  #reportModal .close,
  #reportModal button{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <h1>🍳 Dapur Kapal V10</h1>
  <div>Menu • Stok • Belanja • Laporan</div>
</header>

<div class="container">

<div class="card">
  <div class="grid">
    <div>
      <label>👥 Jumlah Crew</label>
      <input id="crewInput" type="number" min="1" value="9">
    </div>

    <div>
      <label>🔎 Cari Resep</label>
      <input id="searchInput" placeholder="Cari resep...">
    </div>

    <div>
      <label>📂 Kategori</label>
      <select id="categoryFilter">
        <option value="Semua">Semua</option>
        <option value="Ikan">Ikan</option>
        <option value="Ayam">Ayam</option>
        <option value="Praktis">Praktis</option>
      </select>
    </div>
  </div>

  <button id="darkBtn">🌙 Mode Gelap</button>
  <button id="addRecipeBtn">➕ Tambah Resep</button>
  <button id="weeklyBtn">📅 Menu 7 Hari</button>
  <button id="stockBtn">📦 Stok Bahan</button>
  <button id="reportBtn" class="success">📊 Laporan</button>
</div>

<div class="card">
  <h2>🍽️ Daftar Resep</h2>
  <div id="recipeList" class="grid"></div>
</div>

</div>


<!-- DETAIL MODAL -->
<div id="detailModal" class="modal">
<div class="modal-box">
<button class="close" id="closeDetail">✕</button>
<div id="detailContent"></div>
</div>
</div>


<!-- COOK MODAL -->
<div id="cookModal" class="modal">
<div class="modal-box">
<button class="close" id="closeCook">✕</button>
<div id="cookContent"></div>
</div>
</div>


<!-- WEEKLY MODAL -->
<div id="weeklyModal" class="modal">
<div class="modal-box">
<button class="close" id="closeWeekly">✕</button>

<h2>📅 Menu 7 Hari</h2>

<div id="weeklyDays"></div>

<button id="saveWeekly" class="success">💾 Simpan Menu</button>
<button id="weeklyShopping" class="warning">🛒 Buat Daftar Belanja</button>

</div>
</div>


<!-- STOCK MODAL -->
<div id="stockModal" class="modal">
<div class="modal-box">
<button class="close" id="closeStock">✕</button>

<h2>📦 Stok Bahan Kapal</h2>

<div class="card">
<label>Nama bahan</label>
<input id="stockName" placeholder="Contoh: ikan">

<label>Jumlah</label>
<input id="stockQty" type="number" step="0.01">

<label>Satuan</label>
<select id="stockUnit">
<option value="kg">kg</option>
<option value="liter">liter</option>
<option value="ml">ml</option>
<option value="butir">butir</option>
<option value="buah">buah</option>
<option value="siung">siung</option>
<option value="batang">batang</option>
<option value="lembar">lembar</option>
<option value="ikat">ikat</option>
<option value="bungkus">bungkus</option>
<option value="sdm">sdm</option>
<option value="sdt">sdt</option>
</select>

<button id="addStock" class="success">➕ Tambah Stok</button>
</div>

<div id="stockList"></div>

<button id="checkWeeklyStock" class="warning">
📦 Cek Stok 7 Hari
</button>

</div>
</div>


<!-- ADD RECIPE MODAL -->
<div id="recipeModal" class="modal">
<div class="modal-box">
<button class="close" id="closeRecipe">✕</button>

<h2 id="recipeFormTitle">➕ Tambah Resep</h2>

<input type="hidden" id="editId">

<label>Nama Resep</label>
<input id="recipeName">

<label>Kategori</label>
<select id="recipeCategory">
<option>Ikan</option>
<option>Ayam</option>
<option>Praktis</option>
</select>

<label>Waktu Masak</label>
<input id="recipeTime" placeholder="30 menit">

<label>Bahan</label>
<textarea id="recipeIngredients"
placeholder="1 kg ikan
5 siung bawang merah
2 sdm minyak"></textarea>

<label>Langkah Memasak</label>
<textarea id="recipeSteps"
placeholder="1. Bersihkan bahan
2. Tumis bumbu
3. Masukkan ikan"></textarea>

<button id="saveRecipe" class="success">💾 Simpan</button>

</div>
</div>


<!-- SHOPPING MODAL -->
<div id="shoppingModal" class="modal">
<div class="modal-box">
<button class="close" id="closeShopping">✕</button>

<h2>🛒 Daftar Belanja</h2>

<div id="shoppingContent"></div>

</div>
</div>


<!-- REPORT MODAL -->
<div id="reportModal" class="modal">
<div class="modal-box">

<button class="close" id="closeReport">✕</button>

<h2>📊 Laporan Dapur Kapal</h2>

<div id="reportContent"></div>

<button id="printReport" class="success">
🖨️ Cetak Laporan
</button>

</div>
</div>


<script>

const DEFAULT_RECIPES = [

{
id:1,
name:"Pindang Ikan",
category:"Ikan",
time:"35 menit",
ingredients:[
"1 kg ikan",
"8 siung bawang merah",
"5 siung bawang putih",
"2 batang serai",
"3 lembar daun salam",
"2 sdm minyak",
"1 liter air",
"Garam secukupnya"
],
steps:[
"Bersihkan ikan.",
"Tumis bawang sampai harum.",
"Masukkan serai dan daun salam.",
"Tambahkan air.",
"Masukkan ikan.",
"Tambahkan garam.",
"Masak sampai matang."
]
},

{
id:2,
name:"Ayam Rica-Rica",
category:"Ayam",
time:"40 menit",
ingredients:[
"1 kg ayam",
"8 siung bawang merah",
"5 siung bawang putih",
"10 buah cabai",
"2 batang serai",
"2 sdm minyak",
"500 ml air"
],
steps:[
"Potong ayam.",
"Tumis bumbu.",
"Masukkan ayam.",
"Tambahkan air.",
"Masak sampai ayam empuk."
]
},

{
id:3,
name:"Nasi Goreng",
category:"Praktis",
time:"20 menit",
ingredients:[
"1 kg nasi",
"4 butir telur",
"5 siung bawang putih",
"6 buah cabai",
"3 sdm minyak",
"Garam secukupnya"
],
steps:[
"Panaskan minyak.",
"Tumis bawang.",
"Masukkan telur.",
"Masukkan nasi.",
"Tambahkan garam.",
"Aduk sampai matang."
]
},

{
id:4,
name:"Ikan Kecap Pedas",
category:"Ikan",
time:"30 menit",
ingredients:[
"1 kg ikan",
"6 siung bawang merah",
"4 siung bawang putih",
"8 buah cabai",
"5 sdm kecap",
"2 sdm minyak",
"300 ml air"
],
steps:[
"Goreng ikan sebentar.",
"Tumis bumbu.",
"Tambahkan kecap.",
"Masukkan air.",
"Masukkan ikan.",
"Masak sampai bumbu meresap."
]
},

{
id:5,
name:"Soto Ayam",
category:"Ayam",
time:"45 menit",
ingredients:[
"1 kg ayam",
"2 liter air",
"8 siung bawang merah",
"5 siung bawang putih",
"2 batang serai",
"3 lembar daun salam",
"Garam secukupnya"
],
steps:[
"Rebus ayam.",
"Tumis bumbu.",
"Masukkan bumbu ke kuah.",
"Masukkan serai dan daun salam.",
"Masak sampai harum."
]
},

{
id:6,
name:"Mie Goreng",
category:"Praktis",
time:"20 menit",
ingredients:[
"10 bungkus mie",
"5 siung bawang putih",
"6 buah cabai",
"3 sdm minyak",
"2 butir telur"
],
steps:[
"Rebus mie.",
"Tumis bumbu.",
"Masukkan telur.",
"Masukkan mie.",
"Aduk sampai rata."
]
},

{
id:7,
name:"Gulai Ayam",
category:"Ayam",
time:"45 menit",
ingredients:[
"1 kg ayam",
"500 ml santan",
"6 siung bawang merah",
"4 siung bawang putih",
"2 batang serai",
"500 ml air",
"Garam secukupnya"
],
steps:[
"Tumis bumbu.",
"Masukkan ayam.",
"Tambahkan air.",
"Masukkan santan.",
"Masak sampai ayam matang."
]
},

{
id:8,
name:"Ikan Woku",
category:"Ikan",
time:"35 menit",
ingredients:[
"1 kg ikan",
"8 siung bawang merah",
"5 siung bawang putih",
"8 buah cabai",
"2 batang serai",
"3 lembar daun jeruk",
"500 ml air"
],
steps:[
"Tumis bumbu.",
"Masukkan serai dan daun jeruk.",
"Masukkan ikan.",
"Tambahkan air.",
"Masak sampai matang."
]
}

];


let customRecipes =
JSON.parse(localStorage.getItem("dapurKapalCustomV7") || "[]");

let favorites =
JSON.parse(localStorage.getItem("dapurKapalFavoritesV7") || "[]");

let shopping =
JSON.parse(localStorage.getItem("dapurKapalShoppingV7") || "[]");

let weeklyMenu =
JSON.parse(localStorage.getItem("dapurKapalWeeklyMenuV8") || "{}");

let stock =
JSON.parse(localStorage.getItem("dapurKapalStockV9") || "[]");

let prices =
JSON.parse(localStorage.getItem("dapurKapalPricesV10") || "{}");

let crew =
Number(localStorage.getItem("dapurKapalCrewV8") || 9);

document.getElementById("crewInput").value=crew;


function allRecipes(){
return [...DEFAULT_RECIPES,...customRecipes];
}


function formatNumber(n){
return Number(Number(n).toFixed(2));
}


function parseIngredient(text){

let m=text.trim().match(
/^([\d.]+)\s*(kg|liter|l|ml|butir|buah|siung|batang|lembar|ikat|bungkus|sdm|sdt)\s+(.+)$/i
);

if(!m)return null;

let qty=Number(m[1]);
let unit=m[2].toLowerCase();

if(unit==="l")unit="liter";

return {
qty,
unit,
name:m[3].trim().toLowerCase()
};

}


function scaledIngredients(recipe){

let factor=crew/9;

return recipe.ingredients.map(x=>{

let p=parseIngredient(x);

if(!p)return x;

return `${formatNumber(p.qty*factor)} ${p.unit} ${p.name}`;

});

}


function normalizeKey(name,unit){
return name.trim().toLowerCase()+"|"+unit.toLowerCase();
}


function renderRecipes(){

let search=
document.getElementById("searchInput").value.toLowerCase();

let cat=
document.getElementById("categoryFilter").value;

let list=allRecipes().filter(r=>{

let okSearch=r.name.toLowerCase().includes(search);

let okCat=cat==="Semua" || r.category===cat;

return okSearch && okCat;

});

let box=document.getElementById("recipeList");

box.innerHTML="";

list.forEach(recipe=>{

let fav=favorites.includes(recipe.id);

let div=document.createElement("div");
div.className="recipe";

div.innerHTML=`
<h3>${recipe.name}</h3>

<span class="badge">📂 ${recipe.category}</span>
<span class="badge">⏱️ ${recipe.time}</span>

<br>

<button class="detailBtn" data-id="${recipe.id}">
👀 Detail
</button>

<button class="cookBtn" data-id="${recipe.id}">
🍳 Masak
</button>

<button class="favBtn" data-id="${recipe.id}">
${fav?"⭐":"☆"}
</button>

${recipe.id>100000 ? `
<button class="editBtn" data-id="${recipe.id}">✏️</button>
<button class="deleteBtn danger" data-id="${recipe.id}">🗑️</button>
`:""}

`;

box.appendChild(div);

});


document.querySelectorAll(".detailBtn").forEach(btn=>{
btn.onclick=()=>showDetail(Number(btn.dataset.id));
});

document.querySelectorAll(".cookBtn").forEach(btn=>{
btn.onclick=()=>showCook(Number(btn.dataset.id));
});

document.querySelectorAll(".favBtn").forEach(btn=>{
btn.onclick=()=>toggleFavorite(Number(btn.dataset.id));
});

document.querySelectorAll(".editBtn").forEach(btn=>{
btn.onclick=()=>editRecipe(Number(btn.dataset.id));
});

document.querySelectorAll(".deleteBtn").forEach(btn=>{
btn.onclick=()=>deleteRecipe(Number(btn.dataset.id));
});

}


function getRecipe(id){
return allRecipes().find(r=>r.id===id);
}


function showDetail(id){

let recipe=getRecipe(id);

if(!recipe)return;

let note=
localStorage.getItem("dapurKapalNote_"+id)||"";

document.getElementById("detailContent").innerHTML=`

<h2>${recipe.name}</h2>

<p>📂 ${recipe.category} | ⏱️ ${recipe.time}</p>

<h3>🥘 Bahan untuk ${crew} orang</h3>

<ul>
${scaledIngredients(recipe).map(x=>`<li>${x}</li>`).join("")}
</ul>

<h3>👨‍🍳 Langkah</h3>

<ol>
${recipe.steps.map(x=>`<li>${x}</li>`).join("")}
</ol>

<h3>📝 Catatan</h3>

<textarea id="recipeNote">${note}</textarea>

<button id="saveNote" class="success">
💾 Simpan Catatan
</button>
`;

document.getElementById("detailModal").style.display="block";

document.getElementById("saveNote").onclick=()=>{

localStorage.setItem(
"dapurKapalNote_"+id,
document.getElementById("recipeNote").value
);

alert("Catatan tersimpan.");

};

}


function showCook(id){

let recipe=getRecipe(id);

if(!recipe)return;

let steps=recipe.steps;

document.getElementById("cookContent").innerHTML=`

<h2>🍳 Mode Chef — ${recipe.name}</h2>

<div id="stepText"></div>

<button id="prevStep">⬅️ Sebelumnya</button>
<button id="nextStep">➡️ Berikutnya</button>

<hr>

<h3>⏱️ Timer</h3>

<input id="timerMinutes" type="number" value="5" min="1">

<button id="startTimer" class="success">
▶️ Mulai Timer
</button>

<div id="timerText" class="big"></div>
`;

let index=0;

function updateStep(){
document.getElementById("stepText").innerHTML=
`<h3>Langkah ${index+1}/${steps.length}</h3>
<p>${steps[index]}</p>`;
}

updateStep();

document.getElementById("prevStep").onclick=()=>{
if(index>0){
index--;
updateStep();
}
};

document.getElementById("nextStep").onclick=()=>{
if(index<steps.length-1){
index++;
updateStep();
}
};

let timer;

document.getElementById("startTimer").onclick=()=>{

clearInterval(timer);

let sec=
Number(document.getElementById("timerMinutes").value)*60;

timer=setInterval(()=>{

sec--;

let m=Math.floor(sec/60);
let s=sec%60;

document.getElementById("timerText").textContent=
`${m}:${String(s).padStart(2,"0")}`;

if(sec<=0){

clearInterval(timer);

alert("⏰ Timer selesai!");

}

},1000);

};

document.getElementById("cookModal").style.display="block";

}


function toggleFavorite(id){

if(favorites.includes(id)){
favorites=favorites.filter(x=>x!==id);
}else{
favorites.push(id);
}

localStorage.setItem(
"dapurKapalFavoritesV7",
JSON.stringify(favorites)
);

renderRecipes();

}


function openAddRecipe(){

document.getElementById("editId").value="";

document.getElementById("recipeName").value="";
document.getElementById("recipeTime").value="";
document.getElementById("recipeIngredients").value="";
document.getElementById("recipeSteps").value="";

document.getElementById("recipeFormTitle").textContent=
"➕ Tambah Resep";

document.getElementById("recipeModal").style.display="block";

}


function editRecipe(id){

let recipe=getRecipe(id);

if(!recipe)return;

document.getElementById("editId").value=id;
document.getElementById("recipeName").value=recipe.name;
document.getElementById("recipeCategory").value=recipe.category;
document.getElementById("recipeTime").value=recipe.time;
document.getElementById("recipeIngredients").value=
recipe.ingredients.join("\n");
document.getElementById("recipeSteps").value=
recipe.steps.join("\n");

document.getElementById("recipeFormTitle").textContent=
"✏️ Edit Resep";

document.getElementById("recipeModal").style.display="block";

}


function deleteRecipe(id){

if(!confirm("Hapus resep ini?"))return;

customRecipes=
customRecipes.filter(r=>r.id!==id);

localStorage.setItem(
"dapurKapalCustomV7",
JSON.stringify(customRecipes)
);

renderRecipes();

}


document.getElementById("saveRecipe").onclick=()=>{

let id=
Number(document.getElementById("editId").value);

let recipe={
id:id || Date.now(),
name:document.getElementById("recipeName").value.trim(),
category:document.getElementById("recipeCategory").value,
time:document.getElementById("recipeTime").value.trim(),
ingredients:document.getElementById("recipeIngredients").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean),
steps:document.getElementById("recipeSteps").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean)
};

if(!recipe.name){
alert("Nama resep belum diisi.");
return;
}

if(id){

let index=customRecipes.findIndex(r=>r.id===id);

if(index!==-1){
customRecipes[index]=recipe;
}

}else{

customRecipes.push(recipe);

}

localStorage.setItem(
"dapurKapalCustomV7",
JSON.stringify(customRecipes)
);

document.getElementById("recipeModal").style.display="none";

renderRecipes();

};


function renderWeekly(){

let days=[
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu",
"Minggu"
];

let box=document.getElementById("weeklyDays");

box.innerHTML="";

days.forEach(day=>{

let current=weeklyMenu[day] || "";

let div=document.createElement("div");

div.className="card";

div.innerHTML=`

<h3>📅 ${day}</h3>

<select class="daySelect" data-day="${day}">

<option value="">-- Pilih Menu --</option>

${allRecipes().map(r=>
`<option value="${r.id}" ${String(r.id)===String(current)?"selected":""}>
${r.name}
</option>`
).join("")}

</select>

`;

box.appendChild(div);

});

}


function saveWeeklyMenu(){

document.querySelectorAll(".daySelect").forEach(sel=>{
weeklyMenu[sel.dataset.day]=sel.value;
});

localStorage.setItem(
"dapurKapalWeeklyMenuV8",
JSON.stringify(weeklyMenu)
);

alert("📅 Menu 7 hari tersimpan.");

}


function getWeeklyRequirements(){

let result={};

for(let day in weeklyMenu){

let id=Number(weeklyMenu[day]);

let recipe=getRecipe(id);

if(!recipe)continue;

recipe.ingredients.forEach(text=>{

let p=parseIngredient(text);

if(!p)return;

let qty=p.qty*(crew/9);

let key=normalizeKey(p.name,p.unit);

if(!result[key]){

result[key]={
name:p.name,
unit:p.unit,
qty:0
};

}

result[key].qty+=qty;

});

}

return Object.values(result);

}


function createShopping(){

let req=getWeeklyRequirements();

shopping=[];

req.forEach(r=>{

let s=stock.find(
x=>normalizeKey(x.name,x.unit)===
normalizeKey(r.name,r.unit)
);

let have=s?Number(s.qty):0;

let need=Math.max(0,r.qty-have);

if(need>0){

shopping.push({
name:r.name,
unit:r.unit,
qty:formatNumber(need)
});

}

});

localStorage.setItem(
"dapurKapalShoppingV7",
JSON.stringify(shopping)
);

renderShopping();

document.getElementById("shoppingModal").style.display="block";

}


function renderShopping(){

let box=document.getElementById("shoppingContent");

if(!shopping.length){

box.innerHTML="<p>✅ Tidak ada bahan yang perlu dibeli.</p>";

return;

}

box.innerHTML=`

<table>

<tr>
<th>Bahan</th>
<th>Jumlah</th>
</tr>

${shopping.map(x=>`
<tr>
<td>${x.name}</td>
<td>${formatNumber(x.qty)} ${x.unit}</td>
</tr>
`).join("")}

</table>
`;

}


function renderStock(){

let box=document.getElementById("stockList");

if(!stock.length){

box.innerHTML="<p>Belum ada stok.</p>";

return;

}

box.innerHTML=`

<table>

<tr>
<th>Bahan</th>
<th>Jumlah</th>
<th>Aksi</th>
</tr>

${stock.map((x,i)=>`

<tr>
<td>${x.name}</td>
<td>${formatNumber(x.qty)} ${x.unit}</td>
<td>
<button class="danger deleteStock" data-index="${i}">
🗑️
</button>
</td>
</tr>

`).join("")}

</table>
`;

document.querySelectorAll(".deleteStock").forEach(btn=>{

btn.onclick=()=>{

let i=Number(btn.dataset.index);

stock.splice(i,1);

localStorage.setItem(
"dapurKapalStockV9",
JSON.stringify(stock)
);

renderStock();

};

});

}


document.getElementById("addStock").onclick=()=>{

let name=
document.getElementById("stockName").value.trim().toLowerCase();

let qty=
Number(document.getElementById("stockQty").value);

let unit=
document.getElementById("stockUnit").value;

if(!name || !qty){

alert("Isi nama dan jumlah stok.");

return;

}

let existing=
stock.find(x=>
normalizeKey(x.name,x.unit)===
normalizeKey(name,unit)
);

if(existing){

existing.qty+=qty;

}else{

stock.push({
name,
qty,
unit
});

}

localStorage.setItem(
"dapurKapalStockV9",
JSON.stringify(stock)
);

document.getElementById("stockName").value="";
document.getElementById("stockQty").value="";

renderStock();

};


function checkWeeklyStock(){

let req=getWeeklyRequirements();

let html=`

<h3>📦 Kebutuhan Menu 7 Hari</h3>

<table>

<tr>
<th>Bahan</th>
<th>Butuh</th>
<th>Stok</th>
<th>Status</th>
<th>Perlu Beli</th>
</tr>
`;

req.forEach(r=>{

let s=stock.find(
x=>normalizeKey(x.name,x.unit)===
normalizeKey(r.name,r.unit)
);

let have=s?Number(s.qty):0;

let need=Math.max(0,r.qty-have);

let status="CUKUP";
let cls="good";

if(have===0){
status="TIDAK ADA STOK";
cls="bad";
}else if(have<r.qty){
status="STOK KURANG";
cls="warn";
}

html+=`

<tr>
<td>${r.name}</td>
<td>${formatNumber(r.qty)} ${r.unit}</td>
<td>${formatNumber(have)} ${r.unit}</td>
<td class="${cls}">${status}</td>
<td>${formatNumber(need)} ${r.unit}</td>
</tr>
`;

});

html+=`</table>`;

document.getElementById("shoppingContent").innerHTML=html;

document.getElementById("shoppingModal").style.display="block";

}


function priceKey(name,unit){
return normalizeKey(name,unit);
}


function savePrice(key,value){

let num=Number(value);

if(isNaN(num))return;

prices[key]=num;

localStorage.setItem(
"dapurKapalPricesV10",
JSON.stringify(prices)
);

}


function formatRupiah(num){

return new Intl.NumberFormat(
"id-ID",
{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}
).format(num);

}


function generateReport(){

let req=getWeeklyRequirements();

let totalCost=0;

let kurang=0;
let noStock=0;

let selectedDays=
Object.values(weeklyMenu)
.filter(Boolean).length;

let menuHtml="";

const days=[
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu",
"Minggu"
];

days.forEach(day=>{

let id=Number(weeklyMenu[day]);

let r=getRecipe(id);

menuHtml+=`

<tr>
<td>${day}</td>
<td>${r?r.name:"-"}</td>
</tr>

`;

});


let ingredientHtml="";

req.forEach(r=>{

let s=stock.find(
x=>normalizeKey(x.name,x.unit)===
normalizeKey(r.name,r.unit)
);

let have=s?Number(s.qty):0;

let buy=Math.max(0,r.qty-have);

if(have===0)noStock++;
else if(have<r.qty)kurang++;

let key=priceKey(r.name,r.unit);

let price=Number(prices[key]||0);

let cost=buy*price;

totalCost+=cost;

ingredientHtml+=`

<tr>

<td>${r.name}</td>

<td>${formatNumber(r.qty)} ${r.unit}</td>

<td>${formatNumber(have)} ${r.unit}</td>

<td>
${formatNumber(buy)} ${r.unit}
</td>

<td>

<input
class="priceInput"
data-key="${key}"
type="number"
min="0"
value="${price}"
placeholder="Harga/${r.unit}"
>

</td>

<td>
${formatRupiah(cost)}
</td>

</tr>
`;

});


document.getElementById("reportContent").innerHTML=`

<div class="grid">

<div class="stat">
<div>📅 Hari Terisi</div>
<div class="big">${selectedDays}/7</div>
</div>

<div class="stat">
<div>⚠️ Stok Kurang</div>
<div class="big">${kurang}</div>
</div>

<div class="stat">
<div>❌ Tidak Ada Stok</div>
<div class="big">${noStock}</div>
</div>

<div class="stat">
<div>💰 Estimasi Belanja</div>
<div class="big">${formatRupiah(totalCost)}</div>
</div>

</div>


<div class="card">

<h3>📅 Menu Mingguan</h3>

<table>

<tr>
<th>Hari</th>
<th>Menu</th>
</tr>

${menuHtml}

</table>

</div>


<div class="card">

<h3>🛒 Rekap Kebutuhan Bahan</h3>

<p>
Masukkan harga per satuan untuk mendapatkan estimasi biaya belanja.
</p>

<table>

<tr>
<th>Bahan</th>
<th>Total Butuh</th>
<th>Stok</th>
<th>Perlu Beli</th>
<th>Harga/Satuan</th>
<th>Estimasi</th>
</tr>

${ingredientHtml}

</table>

<br>

<button id="savePrices" class="success">
💾 Simpan Harga
</button>

<button id="refreshReport">
🔄 Hitung Ulang
</button>

</div>

<div class="card">

<h3>💰 Total Estimasi Belanja</h3>

<div class="big">
${formatRupiah(totalCost)}
</div>

</div>

`;


document.getElementById("savePrices").onclick=()=>{

document.querySelectorAll(".priceInput").forEach(input=>{

savePrice(
input.dataset.key,
input.value
);

});

alert("💰 Harga berhasil disimpan.");

generateReport();

};


document.getElementById("refreshReport").onclick=()=>{
generateReport();
};

}


document.getElementById("reportBtn").onclick=()=>{

generateReport();

document.getElementById("reportModal").style.display="block";

};


document.getElementById("printReport").onclick=()=>{
window.print();
};


document.getElementById("weeklyBtn").onclick=()=>{

renderWeekly();

document.getElementById("weeklyModal").style.display="block";

};


document.getElementById("saveWeekly").onclick=saveWeeklyMenu;


document.getElementById("weeklyShopping").onclick=createShopping;


document.getElementById("stockBtn").onclick=()=>{

renderStock();

document.getElementById("stockModal").style.display="block";

};


document.getElementById("checkWeeklyStock").onclick=
checkWeeklyStock;


document.getElementById("addRecipeBtn").onclick=
openAddRecipe;


document.getElementById("searchInput").oninput=
renderRecipes;

document.getElementById("categoryFilter").onchange=
renderRecipes;


document.getElementById("crewInput").onchange=()=>{

let value=
Number(document.getElementById("crewInput").value);

if(value<1)value=1;

crew=value;

localStorage.setItem(
"dapurKapalCrewV8",
crew
);

renderRecipes();

};


document.getElementById("darkBtn").onclick=()=>{

document.body.classList.toggle("dark");

localStorage.setItem(
"dapurKapalDarkV7",
document.body.classList.contains("dark")
);

};


if(
localStorage.getItem("dapurKapalDarkV7")==="true"
){
document.body.classList.add("dark");
}


function closeModal(id){
document.getElementById(id).style.display="none";
}


document.getElementById("closeDetail").onclick=()=>{
closeModal("detailModal");
};

document.getElementById("closeCook").onclick=()=>{
closeModal("cookModal");
};

document.getElementById("closeWeekly").onclick=()=>{
closeModal("weeklyModal");
};

document.getElementById("closeStock").onclick=()=>{
closeModal("stockModal");
};

document.getElementById("closeRecipe").onclick=()=>{
closeModal("recipeModal");
};

document.getElementById("closeShopping").onclick=()=>{
closeModal("shoppingModal");
};

document.getElementById("closeReport").onclick=()=>{
closeModal("reportModal");
};


window.onclick=(e)=>{

document.querySelectorAll(".modal").forEach(modal=>{

if(e.target===modal){
modal.style.display="none";
}

});

};


renderRecipes();

</script>
