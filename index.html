/* =====================================================
   SAFE STORAGE
===================================================== */

function loadData(key, fallback){

  try{

    const data = localStorage.getItem(key);

    if(data === null){
      return fallback;
    }

    return JSON.parse(data);

  }catch(error){

    console.log("Storage error:", error);

    return fallback;
  }
}


function saveData(key, value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(error){

    console.log("Save error:", error);
  }
}

function normalizeWeekly(){

  days.forEach(function(day){

    const current=weekly[day];

    if(
      !current ||
      typeof current !== "object" ||
      Array.isArray(current)
    ){

      weekly[day]={
        breakfast:"",
        lunch:current ? String(current) : "",
        dinner:""
      };

    }else{

      weekly[day]={
        breakfast:current.breakfast || "",
        lunch:current.lunch || "",
        dinner:current.dinner || ""
      };

    }

  });

  saveData(STORAGE.weekly,weekly);
}

/* =====================================================
   ESCAPE TEXT
===================================================== */

function safeText(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   FIND RECIPE
===================================================== */

function getRecipe(id){

  return allRecipes.find(
    function(recipe){
      return String(recipe.id)===String(id);
    }
  );
}


/* =====================================================
   FORMAT NUMBER
===================================================== */

function numberFormat(value){

  return Number(value).toLocaleString(
    "id-ID",
    {
      maximumFractionDigits:2
    }
  );
}

let chefTimer=null;
let chefSeconds=0;


function chefMode(id){

  const recipe=getRecipe(id);

  if(!recipe)return;


  let currentStep=0;


  function renderChef(){

    document.getElementById(
      "modalContent"
    ).innerHTML=`

      <h2>👨‍🍳 Mode Chef</h2>

      <h3>
        ${safeText(recipe.name)}
      </h3>

      <p>
        Langkah
        <b>${currentStep+1}</b>
        dari
        <b>${recipe.steps.length}</b>
      </p>

      <div class="step">
        ${safeText(recipe.steps[currentStep])}
      </div>

      <div
        class="timer"
        id="chefTimer"
      >
        00:00
      </div>

      <div class="recipe-actions">

        <button
          class="orange"
          onclick="startTimer()"
        >
          ▶️ Timer
        </button>

        <button
          class="gray"
          onclick="resetTimer()"
        >
          ↺ Reset
        </button>

      </div>

      <br>

      <div class="recipe-actions">

        <button
          class="gray"
          onclick="previousStep()"
        >
          ⬅️ Sebelumnya
        </button>

        <button
          class="btn"
          onclick="nextStep()"
        >
          Berikutnya ➡️
        </button>

      </div>
    `;


    window.nextStep=function(){

      if(
        currentStep<
        recipe.steps.length-1
      ){

        currentStep++;

        resetTimer();

        renderChef();

      }else{

        resetTimer();

        document.getElementById(
          "modalContent"
        ).innerHTML=`

          <h2>🎉 Masakan Selesai!</h2>

          <p>
            <b>${safeText(recipe.name)}</b>
            sudah selesai dimasak.
          </p>

          <div class="step">
            Cek rasa sekali lagi sebelum disajikan.
          </div>

          <button
            class="green"
            onclick="closeModal()"
          >
            ✓ Selesai
          </button>
        `;

      }

    };


    window.previousStep=function(){

      if(currentStep>0){

        currentStep--;

        resetTimer();

        renderChef();

      }

    };

  }


  renderChef();

  openModal();

}


function startTimer(){

  if(chefTimer)return;

  chefTimer=setInterval(
    function(){

      chefSeconds++;

      const minutes=
        Math.floor(
          chefSeconds/60
        );

      const seconds=
        chefSeconds%60;

      const element=
        document.getElementById("chefTimer");

      if(element){

        element.textContent=
          String(minutes).padStart(2,"0")+
          ":"+
          String(seconds).padStart(2,"0");

      }

    },
    1000
  );

}


function resetTimer(){

  clearInterval(chefTimer);

  chefTimer=null;

  chefSeconds=0;

  const element=
    document.getElementById("chefTimer");

  if(element){
    element.textContent="00:00";
  }

}

function saveRecipe(id){

  const name=
    document.getElementById(
      "recipeName"
    ).value.trim();


  if(!name){

    alert("Nama resep belum diisi.");

    return;
  }


  const ingredients=
    document.getElementById(
      "recipeIngredients"
    ).value
    .split("\n")
    .map(function(line){

      return line.trim();

    })
    .filter(Boolean)
    .map(function(line){

      const parts=
        line.split("|")
        .map(function(x){
          return x.trim();
        });


      let amount=
        Number(parts[1]);


      if(Number.isNaN(amount)){
        amount=parts[1] || "";
      }


      return [
        parts[0] || "",
        amount,
        parts[2] || ""
      ];

    });


  const steps=
    document.getElementById(
      "recipeSteps"
    ).value
    .split("\n")
    .map(function(x){
      return x.trim();
    })
    .filter(Boolean);


  if(id){

    const recipe=getRecipe(id);

    if(recipe){

      recipe.name=name;

      recipe.category=
        document.getElementById(
          "recipeCategory"
        ).value;

      recipe.servings=
        Number(
          document.getElementById(
            "recipeServings"
          ).value
        ) || 9;

      recipe.prep=
        document.getElementById(
          "recipePrep"
        ).value;

      recipe.fire=
        document.getElementById(
          "recipeFire"
        ).value;

      recipe.done=
        "Masakan matang dan rasa sudah sesuai";

      recipe.ship=
        document.getElementById(
          "recipeShip"
        ).value;

      recipe.ingredients=
        ingredients;

      recipe.steps=
        steps;

    }

  }else{

    const newRecipe={

      id:Date.now(),

      name:name,

      category:
        document.getElementById(
          "recipeCategory"
        ).value,

      servings:
        Number(
          document.getElementById(
            "recipeServings"
          ).value
        ) || 9,

      prep:
        document.getElementById(
          "recipePrep"
        ).value,

      fire:
        document.getElementById(
          "recipeFire"
        ).value,

      done:
        "Masakan matang dan rasa sudah sesuai",

      ship:
        document.getElementById(
          "recipeShip"
        ).value,

      ingredients:ingredients,

      steps:steps

    };


    customRecipes.push(newRecipe);

  }


  allRecipes=
    recipes.concat(customRecipes);


  saveData(
    STORAGE.custom,
    customRecipes
  );


  closeModal();

  renderRecipes();

  alert("Resep berhasil disimpan.");

}


function deleteRecipe(id){

  if(
    !confirm("Yakin ingin menghapus resep ini?")
  ){
    return;
  }


  customRecipes=

        return recipe.id!==id;
      }
    );


  allRecipes=
    recipes.concat(customRecipes);

/* =====================================================
   WEEKLY REQUIREMENTS
===================================================== */

function getWeeklyRequirements(){

  normalizeWeekly();


  const requirements={};


  days.forEach(
    function(day){

      meals.forEach(
        function(meal){

          const id=
            weekly[day][meal.key];


          if(!id)return;


          const recipe=
            getRecipe(id);


          if(!recipe)return;


          const ratio=
            getCrew()/recipe.servings;


          recipe.ingredients.forEach(
            function(item){

              const name=item[0];

              const amount=item[1];

              const unit=item[2];


              if(
                typeof amount!=="number"
              ){
                return;
              }


              const key=
                name+"|"+unit;


              if(!requirements[key]){

                requirements[key]={
                  name:name,
                  unit:unit,
                  amount:0
                };

              }


              requirements[key].amount +=
                amount*ratio;

            }
          );

        }
      );

    }
  );


  return requirements;

}

  const requirements=

        <div class="stock-row">

          <label>
            <input
              type="checkbox"
              ${
                item.checked
                ? "checked"
                : ""
              }
              onchange="
                toggleShopping(${index})
              "
            >

            ${safeText(item.name)}
          </label>

          <b>
            ${numberFormat(item.amount)}
          </b>

          <span>
            ${safeText(item.unit)}
          </span>

        </div>
      `;

    }
  );


  html+=`

    <br>

    <button
      class="green"
      onclick="createWeeklyShopping()"
    >
      🔄 Hitung Ulang
    </button>

    <button
      class="orange"
      onclick="showStock()"
    >
      📦 Cek Stok
    </button>
  `;


  document.getElementById(
    "modalContent"
  ).innerHTML=html;


  openModal();

}


function toggleShopping(index){

  shopping[index].checked=
    !shopping[index].checked;


  saveData(
    STORAGE.shopping,
    shopping
  );

}


/* =====================================================
   STOCK
===================================================== */

function showStock(){

  if(!shopping.length){

    createWeeklyShopping();

    return;
  }


  let html=`

    <h2>📦 Stok Kapal</h2>

    <p>
      Masukkan stok bahan yang tersedia.
    </p>
  `;


  shopping.forEach(
    function(item){

      const key=
        item.name+"|"+item.unit;


      const current=
        Number(stock[key] || 0);


      html+=`

        <div class="stock-row">

          <b>
            ${safeText(item.name)}
          </b>

          <input
            type="number"
            min="0"
            value="${current}"
            onchange="
              saveStock(
                '${encodeURIComponent(key)}',
                this.value
              )
            "
          >

          <span>
            ${safeText(item.unit)}
          </span>

        </div>
      `;

    }
  );


  html+=`

    <br>

    <button
      class="orange"
      onclick="showStockNeed()"
    >
      🛒 Cek Kekurangan
    </button>
  `;


  document.getElementById(
    "modalContent"
  ).innerHTML=html;


  openModal();

}


function saveStock(encoded,value){

  const key=
    decodeURIComponent(encoded);


  stock[key]=
    Number(value) || 0;


  saveData(
    STORAGE.stock,
    stock
  );

}


function showStockNeed(){

  let html=`

    <h2>🛒 Bahan yang Kurang</h2>
  `;


  let found=false;


  shopping.forEach(
    function(item){

      const key=
        item.name+"|"+item.unit;


      const available=
        Number(stock[key] || 0);


      const need=
        Math.max(
          0,
          item.amount-available
        );


      if(need>0){

        found=true;


        html+=`

          <div class="card">

            <b>
              ${safeText(item.name)}
            </b>

            <br>

            Butuh:
            ${numberFormat(item.amount)}
            ${safeText(item.unit)}

            <br>

            Stok:
            ${numberFormat(available)}
            ${safeText(item.unit)}

            <br>

            <b>
              Kurang:
              ${numberFormat(need)}
              ${safeText(item.unit)}
            </b>

          </div>
        `;

      }

    }
  );


  if(!found){

    html+=`

      <div class="card">
        ✅ Stok cukup untuk semua kebutuhan.
      </div>
    `;

  }


  document.getElementById(
    "modalContent"
  ).innerHTML=html;


  openModal();

}


/* =====================================================
   REPORT
===================================================== */

function showReport(){

  normalizeWeekly();


  const requirements=
    getWeeklyRequirements();


  let total=0;


  let html=`

    <h2>📊 Laporan Dapur Kapal</h2>

    <div class="card">

      <b>👨‍🍳 Kru:</b>
      ${getCrew()} orang

      <br>

      <b>🍽️ Waktu makan:</b>
      Sarapan + Siang + Malam

    </div>

    <h3>📅 Menu Mingguan</h3>

    <table>

      <tr>
        <th>Hari</th>
        <th>🌅 Sarapan</th>
        <th>🍛 Siang</th>
        <th>🌙 Malam</th>
      </tr>
  `;


  days.forEach(
    function(day){

      const menu=
        weekly[day];


      html+=`

        <tr>

          <td>
            <b>${day}</b>
          </td>

          <td>
            ${getRecipeName(menu.breakfast)}
          </td>

          <td>
            ${getRecipeName(menu.lunch)}
          </td>

          <td>
            ${getRecipeName(menu.dinner)}
          </td>

        </tr>
      `;

    }
  );


  html+=`
    </table>

    <h3>🧾 Kebutuhan Bahan</h3>

    <table>

      <tr>
        <th>Bahan</th>
        <th>Jumlah</th>
        <th>Harga</th>
        <th>Total</th>
      </tr>
  `;


  Object.values(requirements)
    .forEach(
      function(item){

        const key=
          item.name+"|"+item.unit;


        const price=
          Number(prices[key] || 0);


        const subtotal=
          item.amount*price;


        total+=subtotal;


        html+=`

          <tr>

            <td>
              ${safeText(item.name)}
            </td>

            <td>
              ${numberFormat(item.amount)}
              ${safeText(item.unit)}
            </td>

            <td>

              <input
                type="number"
                value="${price}"
                placeholder="Harga"
                onchange="
                  savePrice(
                    '${encodeURIComponent(key)}',
                    this.value
                  )
                "
              >

            </td>

            <td>
              Rp ${formatRupiah(subtotal)}
            </td>

          </tr>
        `;

      }
    );


  html+=`

    </table>

    <div class="total">
      💰 Estimasi Total:
      Rp ${formatRupiah(total)}
    </div>

    <br>

    <button
      class="green"
      onclick="window.print()"
    >
      🖨️ Cetak Laporan
    </button>
  `;


  document.getElementById(
    "modalContent"
  ).innerHTML=html;


  openModal();

}


function getRecipeName(id){

  if(!id){
    return "-";
  }


  const recipe=
    getRecipe(id);


  return recipe
    ? safeText(recipe.name)
    : "-";

}


function savePrice(encoded,value){

  const key=
    decodeURIComponent(encoded);


  prices[key]=
    Number(value) || 0;


  saveData(
    STORAGE.price,
    prices
  );

}


function formatRupiah(value){

  return Number(
    value || 0
  ).toLocaleString(
    "id-ID"
  );

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderRecipes
  );


document
  .getElementById("category")
  .addEventListener(
    "change",
    renderRecipes
  );


document
  .getElementById("weeklyBtn")
  .addEventListener(
    "click",
    showWeekly
  );


document
  .getElementById("stockBtn")
  .addEventListener(
    "click",
    showStock
  );


document
  .getElementById("shoppingBtn")
  .addEventListener(
    "click",
    showShopping
  );


document
  .getElementById("reportBtn")
  .addEventListener(
    "click",
    showReport
  );


document
  .getElementById("addRecipeBtn")
  .addEventListener(
    "click",
    showAddRecipe
  );


/* =====================================================
   START APP
===================================================== */

normalizeWeekly();

renderRecipes();

</script>
