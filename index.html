<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
body.dark{
  background:#121212;
  color:#eee;
}
header{
  background:linear-gradient(135deg,#0066cc,#00a8ff);
  color:white;
  padding:22px 15px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0}
.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}
.controls{
  display:grid;
  grid-template-columns:1fr 150px;
  gap:10px;
  margin-bottom:12px;
}
input,select,textarea,button{
  font:inherit;
}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:10px;
  background:white;
  color:#222;
}
body.dark input,
body.dark select,
body.dark textarea{
  background:#222;
  color:#eee;
  border-color:#555;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  cursor:pointer;
  background:#0066cc;
  color:white;
  font-weight:bold;
}
button:hover{opacity:.9}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}
.actions button{background:#333}
body.dark .actions button{background:#444}
.categories{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}
.categories button{
  background:#e1e7ed;
  color:#222;
}
.categories button.active{
  background:#0066cc;
  color:white;
}
body.dark .categories button{
  background:#333;
  color:#eee;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}
.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}
body.dark .card{
  background:#1e1e1e;
}
.card img{
  width:100%;
  height:170px;
  object-fit:cover;
}
.card-content{
  padding:14px;
}
.card h3{margin:0 0 6px}
.card p{margin:5px 0;color:#666}
body.dark .card p{color:#bbb}
.badge{
  display:inline-block;
  padding:4px 8px;
  background:#e7f2ff;
  color:#0066cc;
  border-radius:20px;
  font-size:12px;
}
.card-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.card-buttons button{
  flex:1;
  min-width:70px;
  font-size:13px;
}
.btn-fav{background:#e91e63}
.btn-cook{background:#008f4c}
.btn-shop{background:#f39c12}
.btn-edit{background:#6c5ce7}
.btn-delete{background:#c0392b}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}
.modal{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:16px;
  padding:20px;
}
body.dark .modal{
  background:#1e1e1e;
  color:#eee;
}
.modal h2{margin-top:0}
.close{
  float:right;
  background:#c0392b;
}
.ingredient{
  padding:7px 0;
  border-bottom:1px solid #ddd;
}
body.dark .ingredient{
  border-color:#444;
}
.step{
  padding:12px;
  margin:8px 0;
  background:#eef6ff;
  border-radius:10px;
}
body.dark .step{
  background:#292929;
}
.timer{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  margin:15px 0;
}
.day-row{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}
.day-name{
  font-weight:bold;
}
.menu-summary{
  padding:10px;
  background:#eef6ff;
  border-radius:10px;
  margin:7px 0;
}
body.dark .menu-summary{

}
.shopping-item{
  padding:8px;
  border-bottom:1px solid #ddd;
}
body.dark .shopping-item{
  border-color:#444;
}
.note-box{
  margin-top:15px;
}
.empty{
  text-align:center;
  padding:30px;
  color:#777;
}
footer{
  text-align:center;
  padding:30px 10px;
  color:#777;
}
@media(max-width:600px){
  .controls{grid-template-columns:1fr}
  .day-row{grid-template-columns:1fr}
}
</style>

);

);

let crew = Number(localStorage.getItem("dapurKapalCrewV8") || 9);

let currentCategory = "Semua";
let currentCookingRecipe = null;
let currentStep = 0;
let currentTimer = null;
let timerSeconds = 0;
let editingId = null;

const DAYS = [

 "Jumat",

 "Minggu"
];

const $ = id => document.getElementById(id);


/* =========================
   SCALE
========================= */

function scaleText(text){
  const factor = crew / 9;

  return text.replace(
    /(\d+(?:\.\d+)?)\s*(kg|liter|l|ml|butir|buah|siung|batang|lembar|ikat|bungkus|sdm|sdt)\b/gi,
    function(match,num,unit){
      const value = Number(num) * factor;

      let display;

      if(Number.isInteger(value)){
        display = value;
      }else{
        display = Number(value.toFixed(2));
      }

      return display + " " + unit;
    }
  );
}


/* =========================
   CATEGORIES
========================= */

function renderCategories(){

  const categories = [
    "Semua",
    ...new Set(recipes.map(r => r.category))
  ];

  $("categories").innerHTML = "";

  categories.forEach(category => {

    const button = document.createElement("button");

    button.textContent = category;

    if(category === currentCategory){
      button.classList.add("active");
    }

    button.addEventListener("click",()=>{
      currentCategory = category;
      renderCategories();
      renderRecipes();
    });

    $("categories").appendChild(button);
  });
}


/* =========================
   RECIPES
========================= */

function renderRecipes(){

  const search = $("searchInput").value.toLowerCase().trim();

  let filtered = recipes.filter(recipe => {

    const categoryMatch =
      currentCategory === "Semua" ||
      recipe.category === currentCategory;

    const searchMatch =
      recipe.name.toLowerCase().includes(search) ||
      recipe.category.toLowerCase().includes(search);

    return categoryMatch && searchMatch;
  });

  const grid = $("recipeGrid");

  grid.innerHTML = "";

  if(filtered.length === 0){
    grid.innerHTML =
      `<div class="empty">😕 Resep tidak ditemukan.</div>`;
    return;
  }

  filtered.forEach(recipe => {

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = recipe.image;
    img.alt = recipe.name;

    img.onerror = function(){
      this.src =
       "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80";
    };

    const content = document.createElement("div");
    content.className = "card-content";

    const title = document.createElement("h3");
    title.textContent = recipe.name;

    const info = document.createElement("p");
    info.innerHTML =
      `<span class="badge">${recipe.category}</span> ⏱️ ${recipe.time}`;

    const buttons = document.createElement("div");
    buttons.className = "card-buttons";

    buttons.append(
      createButton("👀 Lihat","btn-detail",()=>{
        openDetail(recipe.id);
      }),
      createButton(
        favorites.includes(recipe.id) ? "❤️ Favorit" : "🤍 Favorit",
        "btn-fav",
        ()=>{
          toggleFavorite(recipe.id);
        }
      ),
      createButton("👨‍🍳 Masak","btn-cook",()=>{
        startCooking(recipe.id);
      }),
      createButton("🛒 Belanja","btn-shop",()=>{
        addToShopping(recipe.id);
      })
    );

    if(customRecipes.some(r => r.id === recipe.id)){

      buttons.append(
        createButton("✏️ Edit","btn-edit",()=>{
          openEditRecipe(recipe.id);
        }),
        createButton("🗑️ Hapus","btn-delete",()=>{
          deleteRecipe(recipe.id);
        })
      );
    }

    content.append(title,info,buttons);
    card.append(img,content);
    grid.appendChild(card);
  });
}

function createButton(text,className,handler){

  const button = document.createElement("button");

  button.textContent = text;
  button.className = className;
  button.addEventListener("click",handler);

  return button;
}


/* =========================
   DETAIL
========================= */

function openDetail(id){

  const recipe = recipes.find(r => r.id === id);

  if(!recipe) return;

  let html = `
    <h2>${escapeHTML(recipe.name)}</h2>
    <p>
      <span class="badge">${escapeHTML(recipe.category)}</span>
      ⏱️ ${escapeHTML(recipe.time)}
    </p>

    <h3>🥘 Bahan untuk ${crew} crew</h3>
  `;

  recipe.ingredients.forEach(item=>{
    html += `<div class="ingredient">• ${escapeHTML(scaleText(item))}</div>`;
  });

  html += `<h3>👨‍🍳 Cara Memasak</h3>`;

  recipe.steps.forEach((step,index)=>{
    html += `
      <div class="step">
        <b>Langkah ${index+1}</b><br>
        ${escapeHTML(step)}
      </div>
    `;
  });

  const note =
    localStorage.getItem("dapurKapalNote_"+recipe.id) || "";

  html += `
    <div class="note-box">
      <h3>📝 Catatan</h3>
      <textarea id="detailNote" rows="4"
      placeholder="Tulis catatan untuk resep ini...">${escapeHTML(note)}</textarea>
      <br><br>
      <button id="saveNote">💾 Simpan Catatan</button>
    </div>
  `;

  $("detailContent").innerHTML = html;

  $("saveNote").addEventListener("click",()=>{
    localStorage.setItem(
      "dapurKapalNote_"+recipe.id,
      $("detailNote").value
    );

    alert("Catatan disimpan ✅");
  });

  showOverlay("detailOverlay");
}


/* =========================
   FAVORITE
========================= */

function toggleFavorite(id){

  if(favorites.includes(id)){
    favorites = favorites.filter(x => x !== id);
  }else{
    favorites.push(id);
  }

  localStorage.setItem(
    "dapurKapalFavoritesV7",
    JSON.stringify(favorites)
  );

  renderRecipes();
}


/* =========================
   SHOPPING
========================= */

function addToShopping(id){

  const recipe = recipes.find(r => r.id === id);

  if(!recipe) return;

  recipe.ingredients.forEach(item=>{
    shopping.push({
      text:scaleText(item),
      recipe:recipe.name
    });
  });

  localStorage.setItem(
    "dapurKapalShoppingV7",
    JSON.stringify(shopping)
  );

  alert(recipe.name+" masuk daftar belanja 🛒");

  renderShopping();
}

function renderShopping(){

  const box = $("shoppingContent");

  if(shopping.length === 0){

    box.innerHTML =
      `<div class="empty">Daftar belanja masih kosong.</div>`;

    return;
  }

  box.innerHTML = "";

  shopping.forEach((item,index)=>{

    const div = document.createElement("div");
    div.className = "shopping-item";

    div.innerHTML = `
      <b>• ${escapeHTML(item.text)}</b>
      <small> (${escapeHTML(item.recipe)})</small>
      <button data-index="${index}"
        style="float:right;background:#c0392b;padding:5px 8px">
        ×
      </button>
    `;

    div.querySelector("button").addEventListener("click",()=>{
      shopping.splice(index,1);

      localStorage.setItem(
        "dapurKapalShoppingV7",
        JSON.stringify(shopping)
      );

      renderShopping();
    });

    box.appendChild(div);
  });
}


/* =========================
   WEEKLY MENU
========================= */

function openWeeklyMenu(){

  renderWeeklyForm();
  renderWeeklySummary();

  showOverlay("weeklyOverlay");
}

function renderWeeklyForm(){

  const box = $("weeklyForm");

  box.innerHTML = "";

  DAYS.forEach(day=>{

    const row = document.createElement("div");
    row.className = "day-row";

    const label = document.createElement("div");
    label.className = "day-name";
    label.textContent = day;

    const select = document.createElement("select");
    select.dataset.day = day;

    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = "-- Pilih menu --";

    select.appendChild(emptyOption);

    recipes.forEach(recipe=>{

      const option = document.createElement("option");

      option.value = String(recipe.id);
      option.textContent =
        recipe.name+" ("+recipe.category+")";

      if(
        weeklyMenu[day] !== undefined &&
        String(weeklyMenu[day]) === String(recipe.id)
      ){
        option.selected = true;
      }

      select.appendChild(option);
    });

    select.addEventListener("change",()=>{
      weeklyMenu[day] = select.value;
      renderWeeklySummary();
    });

    row.append(label,select);

    box.appendChild(row);
  });
}

function saveWeeklyMenu(){

  const selects =
    document.querySelectorAll("#weeklyForm select");

  const newMenu = {};

  selects.forEach(select=>{
    if(select.value){
      newMenu[select.dataset.day] =
        Number(select.value);
    }
  });

  weeklyMenu = newMenu;

  localStorage.setItem(
    "dapurKapalWeeklyMenuV8",
    JSON.stringify(weeklyMenu)
  );

  renderWeeklySummary();

  alert("Menu 7 hari berhasil disimpan ✅");
}

function renderWeeklySummary(){

  const box = $("weeklySummary");

  box.innerHTML = "";

  DAYS.forEach(day=>{

    const id = weeklyMenu[day];

    const recipe = recipes.find(
      r => String(r.id) === String(id)
    );

    const div = document.createElement("div");

    div.className = "menu-summary";

    div.innerHTML =
      `<b>${day}</b> : ${
        recipe
        ? escapeHTML(recipe.name)
        : "Belum dipilih"
      }`;

    box.appendChild(div);
  });
}

function randomWeeklyMenu(){

  const newMenu = {};

  DAYS.forEach(day=>{

    const random =
      recipes[Math.floor(Math.random()*recipes.length)];

    newMenu[day] = random.id;
  });

  weeklyMenu = newMenu;

  localStorage.setItem(
    "dapurKapalWeeklyMenuV8",
    JSON.stringify(weeklyMenu)
  );

  renderWeeklyForm();
  renderWeeklySummary();
}

function weeklyShopping(){

  const items = [];

  DAYS.forEach(day=>{

    const id = weeklyMenu[day];

    const recipe = recipes.find(
      r => String(r.id) === String(id)
    );

    if(!recipe) return;

    recipe.ingredients.forEach(ingredient=>{

      items.push({
        day:day,
        recipe:recipe.name,
        ingredient:scaleText(ingredient)
      });

    });

  });

  const box = $("shoppingContent");

  if(items.length === 0){

    box.innerHTML =
      `<div class="empty">
        Pilih menu 7 hari terlebih dahulu.
      </div>`;

  }else{

    box.innerHTML = `
      <h3>🛒 Belanja Menu 7 Hari</h3>
      <p>Jumlah dihitung untuk <b>${crew} crew</b>.</p>
    `;

    items.forEach(item=>{

      const div = document.createElement("div");

      div.className = "shopping-item";

      div.innerHTML = `
        <b>${escapeHTML(item.ingredient)}</b><br>
        <small>
          ${escapeHTML(item.day)} — ${escapeHTML(item.recipe)}
        </small>
      `;

      box.appendChild(div);
    });
  }

  showOverlay("shoppingOverlay");
}


/* =========================
   COOKING MODE
========================= */

function startCooking(id){

  const recipe = recipes.find(r => r.id === id);

  if(!recipe) return;

  currentCookingRecipe = recipe;
  currentStep = 0;

  renderCooking();

  showOverlay("cookingOverlay");
}

function renderCooking(){

  const recipe = currentCookingRecipe;

  if(!recipe) return;

  const total = recipe.steps.length;

  const step = recipe.steps[currentStep];

  $("cookingContent").innerHTML = `
    <h2>👨‍🍳 Mode Chef</h2>

    <h3>${escapeHTML(recipe.name)}</h3>

    <p>Langkah ${currentStep+1} dari ${total}</p>

    <div class="step">
      ${escapeHTML(step)}
    </div>

    <div class="timer" id="timerDisplay">
      ${formatTime(timerSeconds)}
    </div>

    <div class="actions">
      <button id="prevStep">⬅️ Sebelumnya</button>
      <button id="nextStep">➡️ Berikutnya</button>
      <button id="startTimer">⏱️ Timer 5 Menit</button>
      <button id="stopTimer">⏹️ Stop Timer</button>
    </div>
  `;

  $("prevStep").addEventListener("click",()=>{
    if(currentStep > 0){
      currentStep--;
      renderCooking();
    }
  });

  $("nextStep").addEventListener("click",()=>{
    if(currentStep < total-1){
      currentStep++;
      renderCooking();
    }else{
      alert("Masakan selesai! 🔥🍳");
    }
  });

  $("startTimer").addEventListener("click",()=>{
    startTimer(300);
  });

  $("stopTimer").addEventListener("click",()=>{
    stopTimer();
  });
}

function startTimer(seconds){

  stopTimer();

  timerSeconds = seconds;

  updateTimerDisplay();

  currentTimer = setInterval(()=>{

    timerSeconds--;

    updateTimerDisplay();

    if(timerSeconds <= 0){

      stopTimer();

      alert("⏰ Waktu selesai!");
    }

  },1000);
}

function stopTimer(){

  if(currentTimer){
    clearInterval(currentTimer);
    currentTimer = null;
  }
}

function updateTimerDisplay(){

  const display = $("timerDisplay");

  if(display){
    display.textContent = formatTime(timerSeconds);
  }
}

function formatTime(seconds){

  const min =
    Math.floor(seconds/60)
      .toString()
      .padStart(2,"0");

  const sec =
    Math.max(0,seconds%60)
      .toString()
      .padStart(2,"0");

  return min+":"+sec;
}


/* =========================
   ADD / EDIT RECIPE
========================= */

function openAddRecipe(){

  editingId = null;

  $("recipeFormTitle").textContent =
    "➕ Tambah Resep";

  $("recipeName").value = "";
  $("recipeCategory").value = "Ikan";
  $("recipeTime").value = "";
  $("recipeImage").value = "";
  $("recipeIngredients").value = "";
  $("recipeSteps").value = "";

  showOverlay("recipeFormOverlay");
}

function openEditRecipe(id){

  const recipe = recipes.find(r => r.id === id);

  if(!recipe) return;

  editingId = id;

  $("recipeFormTitle").textContent =
    "✏️ Edit Resep";

  $("recipeName").value = recipe.name;
  $("recipeCategory").value = recipe.category;
  $("recipeTime").value = recipe.time;
  $("recipeImage").value = recipe.image;
  $("recipeIngredients").value =
    recipe.ingredients.join("\n");

  $("recipeSteps").value =
    recipe.steps.join("\n");

  showOverlay("recipeFormOverlay");
}

function saveRecipe(){

  const name =
    $("recipeName").value.trim();

  const category =
    $("recipeCategory").value;

  const time =
    $("recipeTime").value.trim();

  const image =
    $("recipeImage").value.trim();

  const ingredients =
    $("recipeIngredients").value
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean);

  const steps =
    $("recipeSteps").value
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean);

  if(!name){
    alert("Nama resep belum diisi.");
    return;
  }

  if(ingredients.length === 0){
    alert("Bahan belum diisi.");
    return;
  }

  if(steps.length === 0){
    alert("Langkah memasak belum diisi.");
    return;
  }

  if(editingId){

    const index =
      customRecipes.findIndex(
        r => r.id === editingId
      );

    if(index !== -1){

      customRecipes[index] = {
        id:editingId,
        name,
        category,
        time:time || "30 menit",
        image:image || DEFAULT_RECIPES[0].image,
        ingredients,
        steps
      };
    }

  }else{

    customRecipes.push({
      id:Date.now(),
      name,
      category,
      time:time || "30 menit",
      image:image || DEFAULT_RECIPES[0].image,
      ingredients,
      steps
    });
  }

  localStorage.setItem(
    "dapurKapalCustomV7",
    JSON.stringify(customRecipes)
  );

  recipes = [...DEFAULT_RECIPES,...customRecipes];

  hideOverlay("recipeFormOverlay");

  renderCategories();
  renderRecipes();

  alert("Resep berhasil disimpan ✅");
}

function deleteRecipe(id){

  const recipe =
    customRecipes.find(r => r.id === id);

  if(!recipe) return;

  const confirmDelete =
    confirm("Hapus resep "+recipe.name+"?");

  if(!confirmDelete) return;

  customRecipes =
    customRecipes.filter(r => r.id !== id);

  recipes =
    [...DEFAULT_RECIPES,...customRecipes];

  localStorage.setItem(
    "dapurKapalCustomV7",
    JSON.stringify(customRecipes)
  );

  renderCategories();
  renderRecipes();
}

   DARK MODE
========================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  const isDark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "dapurKapalDarkV7",
    isDark ? "1" : "0"
  );

  $("darkBtn").textContent =
    isDark ? "☀️ Mode Terang" : "🌙 Mode Gelap";
}

function loadDark(){

  const dark =
    localStorage.getItem("dapurKapalDarkV7");

  if(dark === "1"){

    document.body.classList.add("dark");

    $("darkBtn").textContent =
      "☀️ Mode Terang";
  }
}

/* =========================
   MODAL
========================= */

function showOverlay(id){
  $(id).style.display = "flex";
}

function hideOverlay(id){
  $(id).style.display = "none";
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
