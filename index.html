<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dapur Kapal V12</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f9;
  color:#17202a;
}
body.dark{
  background:#12171c;
  color:#eee;
}
header{
  background:#0b7285;
  color:white;
  padding:18px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0 0 6px}
header p{margin:0;font-size:13px}
.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}
.toolbar{
  display:grid;
  grid-template-columns:1fr 130px 130px;
  gap:8px;
  margin-bottom:12px;
}
input,select,textarea,button{
  font:inherit;
}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd5db;
  border-radius:9px;
  background:white;
}
body.dark input,
body.dark select,
body.dark textarea{
  background:#20272d;
  color:#fff;
  border-color:#3d474e;
}
button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  cursor:pointer;
}
.btn{background:#0b7285;color:white}
.btn2{background:#e9ecef;color:#111}
.danger{background:#d6336c;color:white}
.green{background:#2f9e44;color:white}
.orange{background:#f08c00;color:white}
.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #00000012;
}
body.dark .card{
  background:#1b2228;
  box-shadow:none;
}
.card h3{margin:0 0 8px}
.badge{
  display:inline-block;
  background:#dff6fa;
  color:#087f8c;
  padding:5px 8px;
  border-radius:20px;
  font-size:12px;
  margin-right:4px;
}
body.dark .badge{
  background:#173e45;
  color:#8ce4ee;
}
.recipe-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.recipe-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:12px;
}
.section-title{
  margin:22px 0 10px;
}
.hidden{display:none!important}
small{color:#6c757d}
body.dark small{color:#adb5bd}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}
.modal-box{
  background:white;
  color:#17202a;
  max-width:700px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:18px;
}
body.dark .modal-box{
  background:#1b2228;
  color:#eee;
}
.close{
  float:right;
  background:#eee;
}
body.dark .close{background:#333;color:white}

ul,ol{padding-left:22px}
li{margin:6px 0}
.recipe-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:10px 0;
}
.info{
  background:#f1f3f5;
  padding:8px;
  border-radius:8px;
  font-size:12px;
}
body.dark .info{background:#252e35}

.day{
  border:1px solid #dce2e6;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
body.dark .day{border-color:#39434b}
.day h3{margin-top:0}
.meal{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:8px;
  align-items:center;
  margin:7px 0;
}
.meal-label{font-weight:bold;font-size:13px}
.report-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.report-table th,
.report-table td{
  border:1px solid #ddd;
  padding:7px;
  text-align:left;
}
body.dark .report-table th,
body.dark .report-table td{border-color:#444}
.total{
  font-size:18px;
  font-weight:bold;
  margin-top:12px;
}
.step{
  padding:12px;
  border-left:4px solid #0b7285;
  background:#f1f3f5;
  margin-bottom:8px;
  border-radius:7px;
}
body.dark .step{background:#252e35}
.timer{
  font-size:40px;
  text-align:center;
  font-weight:bold;
  margin:15px;
}
.stock-row{
  display:grid;
  grid-template-columns:1fr 100px 100px;
  gap:7px;
  align-items:center;
  margin-bottom:7px;
}
@media(max-width:650px){
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar input{grid-column:1/-1}
  .meal{grid-template-columns:75px 1fr}
  .recipe-info{grid-template-columns:1fr 1fr}
  .stock-row{grid-template-columns:1fr 80px 80px}
}
</style>
</head>

<header>
  <h1>🍳 Dapur Kapal V12</h1>
  <p>Menu kapal • Resep • Stok • Belanja • Laporan</p>
</header>

<div class="container">

  <div class="toolbar">
    <input id="search" placeholder="🔎 Cari resep..." oninput="renderRecipes()">

    <select id="category" onchange="renderRecipes()">
      <option value="">Semua kategori</option>
      <option value="Sarapan">🌅 Sarapan</option>
      <option value="Ikan">🐟 Ikan</option>
      <option value="Ayam">🍗 Ayam</option>
      <option value="Praktis">🍳 Praktis</option>
      <option value="Lainnya">🍲 Lainnya</option>
    </select>

    <button class="btn" onclick="toggleDark()">🌙 Mode</button>
  </div>

  <div class="card">
    <b>👨‍🍳 Jumlah Kru</b>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="crew" type="number" min="1" value="9"
             onchange="saveCrew();renderRecipes();renderWeekly();">
      <button class="green" onclick="showAddRecipe()">➕ Resep</button>
    </div>
  </div>

  <div class="recipe-actions">
    <button class="btn" onclick="showWeekly()">📅 Menu 7 Hari</button>
    <button class="orange" onclick="showStock()">📦 Stok</button>
    <button class="green" onclick="showShopping()">🛒 Belanja</button>
    <button class="btn2" onclick="showReport()">📊 Laporan</button>
  </div>

  <h2 class="section-title">🍽️ Koleksi Resep</h2>
  <div id="recipes" class="recipe-grid"></div>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

/* =====================================================
   HELPER
===================================================== */

function loadJSON(key,fallback){
 try{
   const x=localStorage.getItem(key);
   return x?JSON.parse(x):fallback;
 }catch(e){return fallback}
}

function saveJSON(key,value){
 localStorage.setItem(key,JSON.stringify(value));
}

function esc(text){
 return String(text??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function getCrew(){
 return Math.max(1,Number(document.getElementById("crew").value)||9);
}

function saveCrew(){
 localStorage.setItem(KEY_CREW,getCrew());
}

function scale(value,recipe){
 if(typeof value!=="number") return value;
 return Math.round(value*(getCrew()/recipe.servings)*100)/100;
}

function getRecipe(id){
 return recipes.find(r=>String(r.id)===String(id));
}

function normalizeWeekly(){
 days.forEach(day=>{
   let old=weeklyMenu[day];

   if(!old || typeof old!=="object"){
     weeklyMenu[day]={
       breakfast:"",
       lunch:old?String(old):"",
       dinner:""
     };
   }else{
     weeklyMenu[day]={
       breakfast:old.breakfast||"",
       lunch:old.lunch||"",
       dinner:old.dinner||""
     };
   }
 });
 saveJSON(KEY_WEEK,weeklyMenu);
}

/* =====================================================

===================================================== */

function chefMode(id){

 const r=getRecipe(id);

 let current=0;
 let timer=null;
 let seconds=0;

 function render(){

   const step=r.steps[current];

   document.getElementById("modalContent").innerHTML=`

   <h2>👨‍🍳 Mode Chef</h2>
   <h3>${esc(r.name)}</h3>

   <p>
     Langkah <b>${current+1}</b> dari <b>${r.steps.length}</b>
   </p>

   <div class="step">
     ${esc(step)}
   </div>

   <div class="timer" id="timer">00:00</div>

   <div class="recipe-actions">
     <button class="orange" onclick="startChefTimer()">▶️ Mulai Timer</button>
     <button class="btn2" onclick="resetChefTimer()">↺ Reset</button>
   </div>

   <br>

   <button class="btn2"
     onclick="chefPrevious()">⬅️ Sebelumnya</button>

   <button class="btn"
     onclick="chefNext()">Berikutnya ➡️</button>

   `;

   window.chefNext=function(){
     if(current<r.steps.length-1){
       current++;
       resetChefTimer();
       render();
     }else{
       document.getElementById("modalContent").innerHTML=`
       <h2>🎉 Selesai!</h2>
       <p><b>${esc(r.name)}</b> sudah selesai dimasak.</p>
       <p>Silakan cek rasa sekali lagi sebelum disajikan.</p>
       <button class="green" onclick="closeModal()">✓ Selesai</button>
       `;
     }
   };

   window.chefPrevious=function(){
     if(current>0){
       current--;
       resetChefTimer();
       render();
     }
   };

   window.startChefTimer=function(){
     if(timer)return;

     timer=setInterval(()=>{
       seconds++;

       const m=Math.floor(seconds/60);
       const s=seconds%60;

       const el=document.getElementById("timer");

       if(el){
         el.textContent=
           String(m).padStart(2,"0")+":"+
           String(s).padStart(2,"0");
       }
     },1000);
   };

   window.resetChefTimer=function(){
     clearInterval(timer);
     timer=null;
     seconds=0;

     const el=document.getElementById("timer");
     if(el)el.textContent="00:00";
   };

   openModal();
 }

 render();
}

function saveRecipe(id){

   alert("Nama resep belum diisi.");
   return;
 }

 const ingredients=document
   .getElementById("fIngredients")
   .value
   .split("\n")
   .map(x=>x.trim())
   .filter(Boolean)
   .map(line=>{

     const p=line.split("|").map(x=>x.trim());

     let amount=Number(p[1]);

     if(Number.isNaN(amount)){
       amount=p[1]||"";
     }

     return [
       p[0]||"",
       amount,
       p[2]||""
     ];
   });

 const steps=document
   .getElementById("fSteps")
   .value
   .split("\n")
   .map(x=>x.trim())
   .filter(Boolean);

 if(id){

   const r=getRecipe(id);

   r.name=name;
   r.category=document.getElementById("fCategory").value;
   r.servings=Number(document.getElementById("fServings").value)||9;
   r.prep=document.getElementById("fPrep").value;
   r.fire=document.getElementById("fFire").value;
   r.done="Masakan matang dan rasa sudah sesuai";
   r.ship=document.getElementById("fShip").value;
   r.ingredients=ingredients;
   r.steps=steps;

 }else{

   const newRecipe={
     id:Date.now(),
     name,
     category:document.getElementById("fCategory").value,
     servings:Number(document.getElementById("fServings").value)||9,
     prep:document.getElementById("fPrep").value,
     fire:document.getElementById("fFire").value,
     done:"Masakan matang dan rasa sudah sesuai",
     ship:document.getElementById("fShip").value,
     ingredients,
     steps
   };

   customRecipes.push(newRecipe);
   recipes=[...defaultRecipes,...customRecipes];
 }

 saveJSON(KEY_CUSTOM,customRecipes);

 closeModal();
 renderRecipes();

 alert("Resep berhasil disimpan.");
}

/* =====================================================
   WEEKLY INGREDIENT REQUIREMENT
===================================================== */

function getWeeklyRequirements(){

 normalizeWeekly();

 const req={};

 days.forEach(day=>{

   mealSlots.forEach(slot=>{

     const id=weeklyMenu[day][slot.key];

     if(!id)return;

     const r=getRecipe(id);

     if(!r)return;

     r.ingredients.forEach(item=>{

       const name=item[0];
       const amount=item[1];
       const unit=item[2];

       if(typeof amount!=="number")return;

       const scaled=
         amount*(getCrew()/r.servings);

       const key=name+"|"+unit;

       if(!req[key]){
         req[key]={
           name,
           unit,
           amount:0
         };
       }

       req[key].amount+=scaled;

     });
   });
 });

 return req;
}

   `;
 });

 html+=`
 </table>

 <div class="total">
   💰 Estimasi Total: Rp ${formatRupiah(total)}
 </div>

 <br>

 <button class="green" onclick="window.print()">
   🖨️ Cetak Laporan
 </button>
 `;

 document.getElementById("modalContent").innerHTML=html;

 openModal();
}

 return Number(n||0).toLocaleString("id-ID");
}
