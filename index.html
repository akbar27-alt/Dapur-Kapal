/* =========================
   STORAGE
========================= */

function loadJSON(key, fallback){

  try{

    const value = localStorage.getItem(key);

    if(!value){
      return fallback;
    }

    return JSON.parse(value);

  }catch(error){

    console.warn("Storage error:",error);

    return fallback;
  }
}

);

let favorites = loadJSON(

);

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function getCrew(){

  const value = parseInt(
    document.getElementById("crew").value
  );

  return value > 0 ? value : 1;
}


function scaleText(text){

  const crew = getCrew();

  return text.replace(
    /(\d+(?:[.,]\d+)?)\s*(kg|liter|l|ml|butir|buah|siung|batang|lembar|ikat|bungkus)/gi,
    function(match,number,unit){

      const base = parseFloat(
        number.replace(",",".")
      );

      const scaled = base * crew / 9;

      let result = scaled;

      if(Number.isInteger(scaled)){
        result = scaled;
      }else{
        result = scaled.toFixed(2);
      }

      return result + " " + unit;
    }
  );
}


function safeImage(url){

  if(!url){
    return "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80";
  }

  return url;
}

      recipe.category,
      ...(recipe.ingredients || [])
    ]
    .join(" ")
    .toLowerCase();

    const searchOK =
      !search ||
      searchable.includes(search);

    return categoryOK &&
           favoriteOK &&
           searchOK;
  });


  if(filtered.length === 0){

    grid.innerHTML = `
      <div class="empty">
        <h3>😔 Resep tidak ditemukan</h3>
        <p>Coba kata pencarian atau kategori lain.</p>
      </div>
    `;

    return;
  }


  grid.innerHTML = filtered.map(recipe => {

    const favorite =
      favorites.includes(recipe.id);

    return `

      <div class="card">

        <img
          class="card-img"
          src="${escapeHTML(safeImage(recipe.image))}"
          alt="${escapeHTML(recipe.name)}"
          onerror="this.src='https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80'"
        >

        <div class="card-body">

          <h3>
            ${escapeHTML(recipe.name)}
          </h3>

          <div class="meta">
            ${escapeHTML(recipe.category)}
            • ⏱️ ${escapeHTML(recipe.time || "-")}
            • 👥 9 orang
          </div>

          <div class="card-buttons">

            <button
              class="btn"
              data-action="detail"
              data-id="${recipe.id}"
            >
              👀 Lihat
            </button>

            <button
              class="${favorite ? "favorite-active" : "btn-secondary"}"
              data-action="favorite"
              data-id="${recipe.id}"
            >
              ${favorite ? "❤️ Favorit" : "🤍 Favorit"}
            </button>

            <button
              class="btn-green"
              data-action="cook"
              data-id="${recipe.id}"
            >
              👨‍🍳 Masak
            </button>

            <button
              class="btn-orange"
              data-action="shop"
              data-id="${recipe.id}"
            >
              🛒 Belanja
            </button>

            ${
              customRecipes.some(
                item => item.id === recipe.id
              )
              ?
              `
              <button
                class="btn-secondary"
                data-action="edit"
                data-id="${recipe.id}"
              >
                ✏️ Edit
              </button>

              <button
                class="btn-red"
                data-action="delete"
                data-id="${recipe.id}"
              >
                🗑️ Hapus
              </button>
              `
              :
              ""
            }

          </div>

        </div>

      </div>

    `;

  }).join("");
}


/* =========================
   DETAIL
========================= */

function openDetail(id){

  const recipe =
    recipes.find(item => item.id == id);

  if(!recipe) return;

  const ingredients =
    recipe.ingredients || [];

  const steps =
    recipe.steps || [];

  const crew = getCrew();

  document.getElementById("detailContent").innerHTML = `

    <h2>
      ${escapeHTML(recipe.name)}
    </h2>

    <div class="meta">
      ${escapeHTML(recipe.category)}
      • ⏱️ ${escapeHTML(recipe.time || "-")}
      • 👥 Untuk ${crew} orang
    </div>

    <img
      class="modal-img"
      src="${escapeHTML(safeImage(recipe.image))}"
      alt="${escapeHTML(recipe.name)}"
    >

    <div class="section">

      <h3>🥕 Bahan</h3>

      <ul class="ingredients">

        ${ingredients.map(item => `
          <li>${escapeHTML(scaleText(item))}</li>
        `).join("")}

      </ul>

    </div>


    <div class="section">

      <h3>👨‍🍳 Langkah Memasak</h3>

      <ol class="steps">

        ${steps.map((item,index) => `
          <li>
            <span class="step-number">
              ${index + 1}.
            </span>
            ${escapeHTML(item)}
          </li>
        `).join("")}

      </ol>

    </div>


    <div class="section">

      <h3>📝 Catatan</h3>

      <textarea
        id="recipeNote"
        placeholder="Tulis catatan untuk resep ini..."
      ></textarea>

      <br><br>

      <button
        class="btn"
        id="saveNoteBtn"
      >
        💾 Simpan Catatan
      </button>

      <p
        id="savedNote"
        class="small"
      ></p>

    </div>

  `;

  const savedNote =
    localStorage.getItem(
      "dapurKapalNote_" + recipe.id
    );

  if(savedNote){

    document.getElementById("recipeNote").value =
      savedNote;

    document.getElementById("savedNote").textContent =
      "Catatan tersimpan.";
  }


  document.getElementById("saveNoteBtn")
    .addEventListener("click",function(){

      const note =
        document.getElementById("recipeNote").value;

      localStorage.setItem(
        "dapurKapalNote_" + recipe.id,
        note
      );

      document.getElementById("savedNote").textContent =
        "✅ Catatan berhasil disimpan.";

    });


  showModal("detailModal");
}


/* =========================
   FAVORITE
========================= */

function toggleFavorite(id){

  id = Number(id);

  if(favorites.includes(id)){

    favorites =
      favorites.filter(item => item !== id);

  }else{

    favorites.push(id);

  }

  saveAll();
  renderRecipes();
}


/* =========================
   SHOPPING
========================= */

function addToShopping(id){

  const recipe =
    recipes.find(item => item.id == id);

  if(!recipe) return;

  const crew = getCrew();

  recipe.ingredients.forEach(item => {

    const scaled =
      scaleText(item);

    shopping.push({
      id:Date.now() + Math.random(),
      recipe:recipe.name,
      text:scaled,
      checked:false,
      crew:crew
    });

  });

  saveAll();

  renderShopping();

  showModal("shopModal");
}


function renderShopping(){

  const box =
    document.getElementById("shoppingList");

  if(shopping.length === 0){

    box.innerHTML = `
      <p class="empty">
        🛒 Belum ada daftar belanja.
      </p>
    `;

    return;
  }


  box.innerHTML = shopping.map(item => `

    <label
      class="shop-item ${item.checked ? "checked" : ""}"
    >

      <input
        type="checkbox"
        data-shop-id="${item.id}"
        ${item.checked ? "checked" : ""}
      >

      <span>
        ${escapeHTML(item.text)}
        <small>
          (${escapeHTML(item.recipe)})
        </small>
      </span>

    </label>

  `).join("");
}


/* =========================
   COOKING MODE
========================= */

function startCooking(id){

  cookingRecipe =
    recipes.find(item => item.id == id);

  if(!cookingRecipe) return;

  cookingStepIndex = 0;

  renderCooking();

  showModal("cookModal");
}


function renderCooking(){

  if(!cookingRecipe) return;

  const steps =
    cookingRecipe.steps || [];

  if(steps.length === 0) return;

  const total = steps.length;

  const current =
    steps[cookingStepIndex];

  document.getElementById("cookStep").innerHTML = `

    <div style="font-size:14px;opacity:.7">
      Langkah ${cookingStepIndex + 1}
      dari ${total}
    </div>

    <br>

    <strong>
      ${escapeHTML(current)}
    </strong>

  `;

  const progress =
    ((cookingStepIndex + 1) / total) * 100;

  document.getElementById("progressBar")
    .style.width = progress + "%";


  document.getElementById("previousBtn")
    .disabled =
      cookingStepIndex === 0;

  document.getElementById("nextBtn")
    .textContent =
      cookingStepIndex === total - 1
      ? "✅ Selesai"
      : "Berikutnya ➡️";
}


function nextCooking(){

  if(!cookingRecipe) return;

  const total =
    cookingRecipe.steps.length;

  if(cookingStepIndex < total - 1){

    cookingStepIndex++;

    renderCooking();

  }else{

    alert("🎉 Masakan selesai! Selamat makan crew!");

    closeModal("cookModal");

  }
}


function previousCooking(){

  if(cookingStepIndex > 0){

    cookingStepIndex--;

    renderCooking();

  }
}


/* =========================
   TIMER
========================= */

function updateTimerDisplay(){

  const minutes =
    Math.floor(timerSeconds / 60);

  const seconds =
    timerSeconds % 60;

  document.getElementById("timerDisplay")
    .textContent =
      String(minutes).padStart(2,"0")
      + ":" +
      String(seconds).padStart(2,"0");
}


function startTimer(){

  if(timerInterval) return;

  if(timerSeconds <= 0){

    const minutes =
      parseInt(
        document.getElementById("timerMinutes").value
      );

    if(!minutes || minutes < 1){

      alert("Masukkan waktu timer.");

      return;
    }

    timerSeconds =
      minutes * 60;
  }


  timerInterval =
    setInterval(function(){

      if(timerSeconds <= 0){

        clearInterval(timerInterval);

        timerInterval = null;

        updateTimerDisplay();

        alert("⏰ Timer selesai!");

        return;
      }

      timerSeconds--;

      updateTimerDisplay();

    },1000);

}


function pauseTimer(){

  if(timerInterval){

    clearInterval(timerInterval);

    timerInterval = null;

  }
}


function resetTimer(){

  pauseTimer();

  timerSeconds = 0;

  updateTimerDisplay();

}


/* =========================
   ADD / EDIT
========================= */

function openAddForm(){

  editingId = null;

  document.getElementById("formTitle").textContent =
    "➕ Tambah Resep";

  document.getElementById("recipeName").value = "";
  document.getElementById("recipeCategory").value = "Ikan";
  document.getElementById("recipeImage").value = "";
  document.getElementById("recipeTime").value = "";
  document.getElementById("recipeIngredients").value = "";
  document.getElementById("recipeSteps").value = "";

  showModal("formModal");
}


function openEditForm(id){

  const recipe =
    recipes.find(item => item.id == id);

  if(!recipe) return;

  editingId = Number(id);

  document.getElementById("formTitle").textContent =
    "✏️ Edit Resep";

  document.getElementById("recipeName").value =
    recipe.name;

  document.getElementById("recipeCategory").value =
    recipe.category;

  document.getElementById("recipeImage").value =
    recipe.image || "";

  document.getElementById("recipeTime").value =
    recipe.time || "";

  document.getElementById("recipeIngredients").value =
    recipe.ingredients.join("\n");

  document.getElementById("recipeSteps").value =
    recipe.steps.join("\n");

  showModal("formModal");
}


function saveRecipe(){

  const name =
    document.getElementById("recipeName")
      .value.trim();

  const category =
    document.getElementById("recipeCategory")
      .value;

  const image =
    document.getElementById("recipeImage")
      .value.trim();

  const time =
    document.getElementById("recipeTime")
      .value.trim();

  const ingredients =
    document.getElementById("recipeIngredients")
      .value
      .split("\n")
      .map(item => item.trim())
      .filter(Boolean);

  const steps =
    document.getElementById("recipeSteps")
      .value
      .split("\n")
      .map(item => item.trim())
      .filter(Boolean);


  if(!name){

    alert("Nama resep belum diisi.");

    return;
  }

  if(ingredients.length === 0){

    alert("Masukkan bahan resep.");

    return;
  }

  if(steps.length === 0){

    alert("Masukkan langkah memasak.");

    return;
  }


  if(editingId){

    const index =
      customRecipes.findIndex(
        item => item.id === editingId
      );

    if(index !== -1){

      customRecipes[index] = {

        id:editingId,
        name:name,
        category:category,
        image:image,
        time:time,
        ingredients:ingredients,
        steps:steps

      };

    }

  }else{

    const newRecipe = {

      id:Date.now(),
      name:name,
      category:category,
      image:image,
      time:time,
      ingredients:ingredients,
      steps:steps

    };

    customRecipes.push(newRecipe);

  }


  recipes = [
    ...DEFAULT_RECIPES,
    ...customRecipes
  ];

  saveAll();

  closeModal("formModal");

  renderRecipes();

  alert("✅ Resep berhasil disimpan.");

}


/* =========================
   DELETE
========================= */

function deleteRecipe(id){

  const recipe =
    customRecipes.find(item => item.id == id);

  if(!recipe) return;

  const yakin =
    confirm(
      "Hapus resep \"" +
      recipe.name +
      "\"?"
    );

  if(!yakin) return;

  customRecipes =
    customRecipes.filter(
      item => item.id != id
    );

  recipes = [
    ...DEFAULT_RECIPES,
    ...customRecipes
  ];

  favorites =
    favorites.filter(
      item => item != id
    );

  saveAll();

  renderRecipes();

}


/* =========================
   MODAL
========================= */

function showModal(id){

  document
    .getElementById(id)
    .classList.add("show");
}


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


/* =========================
   EVENTS
========================= */

document
  .getElementById("search")
  .addEventListener("input",renderRecipes);


document
  .getElementById("crew")
  .addEventListener("input",renderRecipes);


document
  .querySelectorAll("[data-category]")
  .forEach(button => {

    button.addEventListener("click",function(){

      document
        .querySelectorAll("[data-category]")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      this.classList.add("active");

      selectedCategory =
        this.dataset.category;

      favoriteOnly = false;

      renderRecipes();

    });

  });


document
  .getElementById("favoriteBtn")
  .addEventListener("click",function(){

    favoriteOnly = !favoriteOnly;

    this.textContent =
      favoriteOnly
      ? "❤️ Favorit Aktif"
      : "❤️ Favorit";

    renderRecipes();

  });


document
  .getElementById("allBtn")
  .addEventListener("click",function(){

    favoriteOnly = false;

    selectedCategory = "Semua";

    document
      .querySelectorAll("[data-category]")
      .forEach(btn => {

        btn.classList.remove("active");

        if(btn.dataset.category === "Semua"){
          btn.classList.add("active");
        }

      });

    document.getElementById("favoriteBtn")
      .textContent = "❤️ Favorit";

    document.getElementById("search")
      .value = "";

    renderRecipes();

  });


document
  .getElementById("darkBtn")
  .addEventListener("click",function(){

    document.body.classList.toggle("dark");

    const dark =
      document.body.classList.contains("dark");

    localStorage.setItem(
      "dapurKapalDarkV7",
      dark ? "1" : "0"
    );

    this.textContent =
      dark
      ? "☀️ Mode Terang"
      : "🌙 Mode Gelap";

  });


document
  .getElementById("addRecipeBtn")
  .addEventListener("click",openAddForm);


document
  .getElementById("shopBtn")
  .addEventListener("click",function(){

    renderShopping();

    showModal("shopModal");

  });


document
  .getElementById("saveRecipeBtn")
  .addEventListener("click",saveRecipe);


document
  .getElementById("previousBtn")
  .addEventListener("click",previousCooking);


document
  .getElementById("nextBtn")
  .addEventListener("click",nextCooking);


document
  .getElementById("startTimerBtn")
  .addEventListener("click",startTimer);


document
  .getElementById("pauseTimerBtn")
  .addEventListener("click",pauseTimer);


document
  .getElementById("resetTimerBtn")
  .addEventListener("click",resetTimer);


document
  .getElementById("clearShopBtn")
  .addEventListener("click",function(){

    if(shopping.length === 0) return;

    if(confirm("Hapus semua daftar belanja?")){

      shopping = [];

      saveAll();

      renderShopping();

    }

  });


/* CARD ACTIONS */

document
  .getElementById("recipeGrid")
  .addEventListener("click",function(event){

    const button =
      event.target.closest("[data-action]");

    if(!button) return;

    const action =
      button.dataset.action;

    const id =
      button.dataset.id;


    if(action === "detail"){
      openDetail(id);
    }

    if(action === "favorite"){
      toggleFavorite(id);
    }

    if(action === "cook"){
      startCooking(id);
    }

    if(action === "shop"){
      addToShopping(id);
    }

    if(action === "edit"){
      openEditForm(id);
    }

    if(action === "delete"){
      deleteRecipe(id);
    }

  });


/* CLOSE BUTTONS */

document
  .querySelectorAll("[data-close]")
  .forEach(button => {

    button.addEventListener("click",function(){

      closeModal(
        this.dataset.close
      );

    });

  });


/* SHOPPING CHECKBOX */

document
  .getElementById("shoppingList")
  .addEventListener("change",function(event){

    const checkbox =
      event.target.closest(
        "[data-shop-id]"
      );

    if(!checkbox) return;

    const id =
      Number(checkbox.dataset.shopId);

    const item =
      shopping.find(
        x => Number(x.id) === id
      );

    if(item){

      item.checked =
        checkbox.checked;

      saveAll();

      renderShopping();

    }

  });


/* CLOSE MODAL OUTSIDE */

document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener("click",function(event){

      if(event.target === modal){

        modal.classList.remove("show");

      }

    });

  });


/* =========================
   DARK MODE LOAD
========================= */

if(
  localStorage.getItem(
    "dapurKapalDarkV7"
  ) === "1"
){

  document.body.classList.add("dark");

  document.getElementById("darkBtn")
    .textContent =
      "☀️ Mode Terang";

}


/* =========================
   INITIAL
========================= */

renderRecipes();

updateTimerDisplay();

</script>

</body>
</html>
