<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚓ Dapur Kapal V6</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
transition:.3s;
}

body.dark{
background:#101722;
color:#f1f5f9;
}

header{
background:linear-gradient(135deg,#075985,#0284c7);
color:white;
padding:22px 16px;
text-align:center;
position:sticky;
top:0;
z-index:20;
box-shadow:0 3px 15px #0003;
}

header h1{font-size:27px}
header p{margin-top:6px;opacity:.9}

.container{
max-width:1100px;
margin:auto;
padding:18px;
}

.hero{
background:linear-gradient(135deg,#0ea5e9,#2563eb);
color:white;
padding:25px;
border-radius:18px;
margin-bottom:18px;
box-shadow:0 8px 25px #0002;
}

.hero h2{font-size:25px;margin-bottom:8px}

.controls{
display:grid;
grid-template-columns:1fr 130px;
gap:10px;
margin-bottom:15px;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:10px;
font-size:15px;
outline:none;
}

textarea{min-height:100px;resize:vertical}

body.dark input,
body.dark select,
body.dark textarea{
background:#1e293b;
color:white;
border-color:#475569;
}

button{
border:0;
border-radius:10px;
padding:11px 14px;
cursor:pointer;
font-weight:bold;
font-size:14px;
}

.btn{
background:#0284c7;
color:white;
}

.btn:hover{opacity:.9}

.btn-secondary{
background:#e2e8f0;
color:#172033;
}

body.dark .btn-secondary{
background:#334155;
color:white;
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:10px;
margin-bottom:12px;
}

.categories button{
white-space:nowrap;
background:white;
border:1px solid #cbd5e1;
}

body.dark .categories button{
background:#1e293b;
color:white;
border-color:#475569;
}

.categories button.active{
background:#0284c7;
color:white;
border-color:#0284c7;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:18px;
}

.recipe-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
}

.card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 5px 18px #0001;
transition:.2s;
position:relative;
}

.card:hover{transform:translateY(-3px)}

body.dark .card{
background:#1e293b;
}

.card-img{
width:100%;
height:180px;
object-fit:cover;
background:#cbd5e1;
}

.card-content{
padding:15px;
}

.card h3{
font-size:19px;
margin-bottom:7px;
}

.meta{
font-size:13px;
opacity:.7;
margin-bottom:12px;
}

.card-buttons{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.favorite{
position:absolute;
right:10px;
top:10px;
background:white;
border-radius:50%;
width:40px;
height:40px;
padding:0;
font-size:20px;
box-shadow:0 2px 8px #0003;
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
padding:20px;
overflow:auto;
}

.modal-box{
background:white;
max-width:700px;
margin:30px auto;
border-radius:18px;
padding:20px;
position:relative;
}

body.dark .modal-box{
background:#172033;
color:white;
}

.close{
position:absolute;
right:15px;
top:12px;
font-size:25px;
background:none;
}

.modal-img{
width:100%;
height:260px;
object-fit:cover;
border-radius:14px;
margin:10px 0 15px;
}

.section{
margin-top:18px;
}

.section h3{
margin-bottom:9px;
}

.ingredients{
padding-left:20px;
line-height:1.8;
}

.steps{
list-style:none;
}

.steps li{
padding:12px;
margin-bottom:8px;
background:#f1f5f9;
border-radius:10px;
}

body.dark .steps li{
background:#263449;
}

.shop-item{
display:flex;
align-items:center;
gap:10px;
padding:9px 0;
border-bottom:1px solid #ddd;
}

.shop-item input{
width:20px;
}

.cooking-step{
font-size:20px;
line-height:1.5;
padding:25px 10px;
text-align:center;
}

.progress{
height:10px;
background:#e2e8f0;
border-radius:10px;
overflow:hidden;
margin:15px 0;
}

.progress-bar{
height:100%;
background:#0284c7;
width:0%;
transition:.3s;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.form-full{
grid-column:1/-1;
}

.empty{
text-align:center;
padding:40px 15px;
opacity:.7;
}

footer{
text-align:center;
padding:30px 15px;
opacity:.7;
}

@media(max-width:800px){
.recipe-grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:560px){
.recipe-grid{
grid-template-columns:1fr;
}

.controls{
grid-template-columns:1fr 100px;
}

.form-grid{
grid-template-columns:1fr;
}

.form-full{
grid-column:auto;
}

.card-img{
height:200px;
}
}
</style>
</head>

<body>

<header>
<h1>⚓ Dapur Kapal V6</h1>
<p>Resep praktis untuk dapur kapal</p>
</header>

<div class="container">

<div class="hero">
<h2>👨‍🍳 Selamat datang di Dapur Kapal!</h2>
<p>Cari resep, atur jumlah crew, lalu mulai masak.</p>
</div>

<div class="controls">
<input id="search" type="text" placeholder="🔎 Cari resep atau bahan...">
<input id="crew" type="number" min="1" value="9" placeholder="Crew">
</div>

<div class="categories">
<button class="active" onclick="filterCategory('Semua',this)">Semua</button>
<button onclick="filterCategory('Ikan',this)">🐟 Ikan</button>
<button onclick="filterCategory('Ayam',this)">🍗 Ayam</button>
<button onclick="filterCategory('Praktis',this)">🍳 Praktis</button>
<button onclick="filterCategory('Lainnya',this)">🍲 Lainnya</button>
</div>

<div class="actions">
<button class="btn" onclick="openAddRecipe()">➕ Tambah Resep</button>
<button class="btn-secondary" onclick="showFavorites()">❤️ Favorit</button>
<button class="btn-secondary" onclick="toggleDark()">🌙 Mode Gelap</button>
</div>

<div id="recipeGrid" class="recipe-grid"></div>

</div>

<footer>
⚓ Dapur Kapal V6<br>
Masak enak, crew senang.
</footer>


<!-- DETAIL MODAL -->
<div id="detailModal" class="modal">
<div class="modal-box">
<button class="close" onclick="closeModal('detailModal')">×</button>

<div id="detailContent"></div>

</div>
</div>


<!-- ADD / EDIT MODAL -->
<div id="formModal" class="modal">
<div class="modal-box">

<button class="close" onclick="closeModal('formModal')">×</button>

<h2 id="formTitle">➕ Tambah Resep</h2>

<br>

<div class="form-grid">

<div>
<label>Nama Resep</label>
<input id="recipeName" placeholder="Contoh: Ikan Sambal">
</div>

<div>
<label>Kategori</label>
<select id="recipeCategory">
<option>Ikan</option>
<option>Ayam</option>
<option>Praktis</option>
<option>Lainnya</option>
</select>
</div>

<div>
<label>URL Foto</label>
<input id="recipeImage" placeholder="https://...">
</div>

<div>
<label>Waktu Masak</label>
<input id="recipeTime" placeholder="30 menit">
</div>

<div class="form-full">
<label>Bahan</label>
<textarea id="recipeIngredients" placeholder="Ikan 1 kg
Bawang merah 8 siung
Cabai 10 buah"></textarea>
</div>

<div class="form-full">
<label>Langkah Memasak</label>
<textarea id="recipeSteps" placeholder="Potong bahan.
Tumis bumbu.
Masukkan ikan.
Masak sampai matang."></textarea>
</div>

</div>

<br>

<button class="btn" onclick="saveRecipe()">💾 Simpan Resep</button>

</div>
</div>


<!-- SHOPPING MODAL -->
<div id="shopModal" class="modal">
<div class="modal-box">

<button class="close" onclick="closeModal('shopModal')">×</button>

<h2>🛒 Daftar Belanja</h2>

<div id="shoppingList" class="section"></div>

<br>

<button class="btn-secondary" onclick="closeModal('shopModal')">Tutup</button>

</div>
</div>


<!-- COOKING MODAL -->
<div id="cookModal" class="modal">
<div class="modal-box">

<button class="close" onclick="closeModal('cookModal')">×</button>

<h2>🔥 Mulai Masak</h2>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="cookStep" class="cooking-step"></div>

<div style="display:flex;justify-content:space-between;gap:10px">
<button class="btn-secondary" onclick="previousStep()">⬅️ Kembali</button>
<button class="btn" onclick="nextStep()">Berikutnya ➡️</button>
</div>

</div>
</div>


<script>

],
steps:[
"Potong ayam dan cuci bersih.",
"Tumis bumbu halus sampai harum.",
"Masukkan serai dan daun jeruk.",
"Masukkan ayam.",
"Aduk sampai ayam berubah warna.",

"Koreksi rasa lalu sajikan."
]
},

{
id:3,
name:"Nasi Goreng",
category:"Praktis",
time:"20 menit",
image:"https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=900&q=80",
ingredients:[
"1,5 kg nasi putih",
"5 butir telur",
"8 siung bawang merah",
"5 siung bawang putih",
"10 cabai",

],
steps:[

"Panaskan minyak.",

"Masukkan nasi.",
"Tambahkan kecap dan garam.",
"Aduk sampai rata dan matang.",
"Sajikan panas."
]
},

{
id:4,
name:"Ikan Kecap Pedas",
category:"Ikan",
time:"35 menit",
image:"https://images.unsplash.com/photo-1534766555764-ce878a5e3a2b?auto=format&fit=crop&w=900&q=80",
ingredients:[
"1 kg ikan",
"8 siung bawang merah",
"5 siung bawang putih",
"10 cabai",
"6 sdm kecap manis",
"1 buah jeruk nipis",
"200 ml air",
"Garam secukupnya"
],
steps:[
"Bersihkan ikan.",
"Goreng ikan sampai setengah matang.",
"Tumis bawang dan cabai.",

]
},

{

name:"Soto Ayam",
category:"Ayam",
time:"60 menit",
image:"https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=900&q=80",

{

],
steps:[
"Potong ayam.",
"Tumis bumbu halus.",
"Masukkan serai dan daun salam.",
"Masukkan ayam.",
"Aduk sampai ayam berubah warna.",
"Tambahkan santan.",
"Masak dengan api kecil.",
"Aduk perlahan sampai matang."
]
},

{
id:8,
name:"Ikan Woku",
category:"Ikan",
time:"40 menit",
image:"https://images.unsplash.com/photo-1544943910-4c1dc44aab44?auto=format&fit=crop&w=900&q=80",
ingredients:[
"1 kg ikan",
"8 siung bawang merah",
"5 siung bawang putih",
"10 cabai",
"2 batang serai",
"3 lembar daun jeruk",
"1 ruas kunyit",
"1 ruas jahe",
"Daun kemangi secukupnya",
"Garam secukupnya"
],
steps:[
"Bersihkan ikan.",
"Haluskan bumbu.",
"Tumis bumbu sampai harum.",
"Masukkan serai dan daun jeruk.",
"Tambahkan sedikit air.",
"Masukkan ikan.",
"Masak sampai matang.",
"Masukkan kemangi terakhir."
]
}

];


let recipes = JSON.parse(localStorage.getItem("dapurKapalRecipes")) || defaultRecipes;

let currentCategory = "Semua";
let favorites = JSON.parse(localStorage.getItem("dapurKapalFavorites")) || [];
let editingId = null;

let cookingSteps = [];
let cookingIndex = 0;


function saveData(){
localStorage.setItem("dapurKapalRecipes",JSON.stringify(recipes));
localStorage.setItem("dapurKapalFavorites",JSON.stringify(favorites));
}


function scaleText(text,crew){

if(!text) return text;

if(text.includes("secukupnya") || text.includes("sesuai selera"))
return text;

return text.replace(/(\d+(?:\.\d+)?)\s*(kg|liter|ml|gram|g|kg|sdm|sdt|buah|butir|siung|batang|ruas|lembar)/gi,
function(match,num,unit){

let value=parseFloat(num);
let scaled=value*(crew/9);

let rounded=Math.round(scaled*10)/10;

return rounded+" "+unit;
});

}


function renderRecipes(){

const grid=document.getElementById("recipeGrid");
const search=document.getElementById("search").value.toLowerCase();
const crew=parseInt(document.getElementById("crew").value)||9;

let filtered=recipes.filter(r=>{

let categoryMatch=currentCategory==="Semua" || r.category===currentCategory;

let textMatch=
r.name.toLowerCase().includes(search) ||
r.category.toLowerCase().includes(search) ||
r.ingredients.join(" ").toLowerCase().includes(search);

return categoryMatch && textMatch;
});


if(filtered.length===0){
grid.innerHTML='<div class="empty">😔 Resep tidak ditemukan.</div>';
return;
}


grid.innerHTML=filtered.map(recipe=>{

let fav=favorites.includes(recipe.id);

return `
<div class="card">

<img class="card-img"
src="${recipe.image || 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80'}"
onerror="this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80'">

<button class="favorite" onclick="toggleFavorite(${recipe.id})">
${fav?'❤️':'🤍'}
</button>

<div class="card-content">

<h3>${recipe.name}</h3>

<div class="meta">
${recipe.category} • ⏱️ ${recipe.time || '-'} • 👥 ${crew} orang
</div>

<div class="card-buttons">

<button class="btn" onclick="showRecipe(${recipe.id})">
👀 Lihat
</button>

<button class="btn-secondary" onclick="openShopping(${recipe.id})">
🛒
</button>

<button class="btn-secondary" onclick="startCooking(${recipe.id})">
🔥
</button>

${recipe.custom ? `
<button class="btn-secondary" onclick="editRecipe(${recipe.id)">
✏️
</button>

<button class="btn-secondary" onclick="deleteRecipe(${recipe.id})">
🗑️
</button>
`:''}

</div>

</div>
</div>
`;

}).join("");

}


function filterCategory(category,button){

currentCategory=category;

document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

renderRecipes();
}


document.getElementById("search").addEventListener("input",renderRecipes);
document.getElementById("crew").addEventListener("input",renderRecipes);


function showRecipe(id){

const recipe=recipes.find(r=>r.id===id);

if(!recipe)return;

const crew=parseInt(document.getElementById("crew").value)||9;

document.getElementById("detailContent").innerHTML=`

<h2>${recipe.name}</h2>

<img class="modal-img"
src="${recipe.image || 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80'}">

<p>🍽️ Kategori: <b>${recipe.category}</b></p>
<p>⏱️ Waktu: <b>${recipe.time || '-'}</b></p>
<p>👥 Untuk <b>${crew} orang</b></p>

<div class="section">
<h3>🥘 Bahan</h3>

<ul class="ingredients">
${recipe.ingredients.map(i=>`<li>${scaleText(i,crew)}</li>`).join("")}
</ul>
</div>

<div class="section">
<h3>👨‍🍳 Cara Memasak</h3>

<ol class="steps">
${recipe.steps.map((s,i)=>`
<li><b>Langkah ${i+1}</b><br>${s}</li>
`).join("")}
</ol>
</div>

<div class="section">
<button class="btn" onclick="openShopping(${recipe.id})">
🛒 Daftar Belanja
</button>

<button class="btn" onclick="startCooking(${recipe.id})">
🔥 Mulai Masak
</button>
</div>
`;

document.getElementById("detailModal").style.display="block";
}


function toggleFavorite(id){

if(favorites.includes(id)){
favorites=favorites.filter(x=>x!==id);
}else{
favorites.push(id);
}

saveData();
renderRecipes();
}


function showFavorites(){

currentCategory="Semua";

document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

let favRecipes=recipes.filter(r=>favorites.includes(r.id));

const grid=document.getElementById("recipeGrid");

if(favRecipes.length===0){
grid.innerHTML='<div class="empty">🤍 Belum ada resep favorit.</div>';
return;
}

grid.innerHTML=favRecipes.map(recipe=>`

<div class="card">

<img class="card-img" src="${recipe.image}">

<div class="card-content">

<h3>${recipe.name}</h3>

<div class="meta">${recipe.category} • ${recipe.time}</div>

<button class="btn" onclick="showRecipe(${recipe.id})">
👀 Lihat Resep
</button>

<button class="btn-secondary" onclick="toggleFavorite(${recipe.id})">
❤️ Hapus Favorit
</button>

</div>
</div>

`).join("");
}


function openAddRecipe(){

editingId=null;

document.getElementById("formTitle").innerText="➕ Tambah Resep";

document.getElementById("recipeName").value="";
document.getElementById("recipeCategory").value="Ikan";
document.getElementById("recipeImage").value="";
document.getElementById("recipeTime").value="";
document.getElementById("recipeIngredients").value="";
document.getElementById("recipeSteps").value="";

document.getElementById("formModal").style.display="block";
}


function editRecipe(id){

const recipe=recipes.find(r=>r.id===id);

if(!recipe)return;

editingId=id;

document.getElementById("formTitle").innerText="✏️ Edit Resep";

document.getElementById("recipeName").value=recipe.name;
document.getElementById("recipeCategory").value=recipe.category;
document.getElementById("recipeImage").value=recipe.image || "";
document.getElementById("recipeTime").value=recipe.time || "";
document.getElementById("recipeIngredients").value=recipe.ingredients.join("\n");
document.getElementById("recipeSteps").value=recipe.steps.join("\n");

document.getElementById("formModal").style.display="block";
}


function saveRecipe(){

const name=document.getElementById("recipeName").value.trim();
const category=document.getElementById("recipeCategory").value;
const image=document.getElementById("recipeImage").value.trim();
const time=document.getElementById("recipeTime").value.trim();

const ingredients=document.getElementById("recipeIngredients").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);

const steps=document.getElementById("recipeSteps").value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);


if(!name || ingredients.length===0 || steps.length===0){

alert("⚠️ Nama resep, bahan, dan langkah memasak wajib diisi.");

return;
}


if(editingId){

const index=recipes.findIndex(r=>r.id===editingId);

recipes[index]={
...recipes[index],
name,
category,
image:image || "https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80",
time,
ingredients,
steps
};

}else{

recipes.push({
id:Date.now(),
name,
category,
image:image || "https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=900&q=80",
time,
ingredients,
steps,
custom:true
});

}

saveData();

closeModal("formModal");

renderRecipes();

alert("✅ Resep berhasil disimpan!");
}


function deleteRecipe(id){

const recipe=recipes.find(r=>r.id===id);

if(!recipe)return;

if(!confirm(`Hapus resep "${recipe.name}"?`))return;

recipes=recipes.filter(r=>r.id!==id);

favorites=favorites.filter(x=>x!==id);

saveData();

renderRecipes();
}


function openShopping(id){

const recipe=recipes.find(r=>r.id===id);

if(!recipe)return;

const crew=parseInt(document.getElementById("crew").value)||9;

document.getElementById("shoppingList").innerHTML=

recipe.ingredients.map((item,index)=>`

<label class="shop-item">

<input type="checkbox">

<span>${scaleText(item,crew)}</span>

</label>

`).join("");

document.getElementById("shopModal").style.display="block";
}


function startCooking(id){

const recipe=recipes.find(r=>r.id===id);

if(!recipe)return;

cookingSteps=recipe.steps;
cookingIndex=0;

document.getElementById("cookModal").style.display="block";

updateCooking();
}


function updateCooking(){

if(cookingSteps.length===0)return;

document.getElementById("cookStep").innerHTML=`

<div style="font-size:14px;opacity:.7">
Langkah ${cookingIndex+1} dari ${cookingSteps.length}
</div>

<br>

${cookingSteps[cookingIndex]}

`;

let percent=((cookingIndex+1)/cookingSteps.length)*100;

document.getElementById("progressBar").style.width=percent+"%";
}


function nextStep(){

if(cookingIndex<cookingSteps.length-1){

cookingIndex++;
updateCooking();

}else{

alert("🎉 Masakan selesai! Selamat makan, crew!");

closeModal("cookModal");
}
}


function previousStep(){

if(cookingIndex>0){

cookingIndex--;
updateCooking();

}
}


function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"dapurKapalDark",
document.body.classList.contains("dark")
);
}


function closeModal(id){

document.getElementById(id).style.display="none";
}


window.onclick=function(e){

document.querySelectorAll(".modal").forEach(modal=>{

if(e.target===modal){
modal.style.display="none";
}

});

}


if(localStorage.getItem("dapurKapalDark")==="true"){
document.body.classList.add("dark");
}

renderRecipes();

</script>

</body>
</html>
