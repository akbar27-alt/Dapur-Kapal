function get(key,def){
try{
let x=localStorage.getItem(key);
return x?JSON.parse(x):def;
}catch(e){
return def;
}
}

function save(key,val){
localStorage.setItem(key,JSON.stringify(val));
}

/* =====================================================
   UTIL
===================================================== */

function esc(s){
return String(s).replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}

function norm(s){
return String(s).toLowerCase().trim();
}

function unitBase(q,u){

u=norm(u);

if(u==="kg"){
return {q:q*1000,u:"gram"};
}

if(u==="g"||u==="gram"){
return {q:q,u:"gram"};
}

if(u==="liter"||u==="l"){
return {q:q*1000,u:"ml"};
}

if(u==="ml"){
return {q:q,u:"ml"};
}

return {q:q,u:u};
}

function convertQty(q,from,to){

let a=unitBase(q,from);
let b=unitBase(1,to);

if(a.u!==b.u){
return null;
}

return a.q/b.q;
}

function stockFind(name){
return stock.find(x=>norm(x.name)===norm(name));
}

function stockAvailable(name,qty,unit){

let s=stockFind(name);

if(!s){
return 0;
}

let converted=convertQty(Number(s.qty),s.unit,unit);

if(converted===null){
return 0;
}

return converted;
}

function formatQty(q){

if(Number.isInteger(q)){
return q;
}

return Number(Number(q).toFixed(2));
}

function scaleIngredient(i){

let factor=Number(crew)/9;

return [
i[0],
Number(i[1])*factor,
i[2]
];
}

function recipeAvailability(r){

let total=r.ingredients.length;
let good=0;

r.ingredients.forEach(i=>{

let need=scaleIngredient(i);

let have=stockAvailable(
need[0],
need[1],
need[2]
);

if(have>=need[1]){
good++;
}

});

return total?
Math.round(good/total*100):
0;
}

/* =====================================================
   COOK
===================================================== */

function cookRecipe(id){

let r=recipes.find(x=>x.id===id);

if(!r)return;

let missing=[];

r.ingredients.forEach(i=>{

let need=scaleIngredient(i);

let have=stockAvailable(
need[0],
need[1],
need[2]
);

if(have<need[1]){

missing.push(
`${need[0]} kurang ${
formatQty(need[1]-have)
} ${need[2]}`
);

}

});

if(missing.length){

alert(
"⚠️ STOK TIDAK CUKUP\n\n"+
missing.map(x=>"• "+x).join("\n")
);

return;
}

if(!confirm(
`Masak ${r.name} untuk ${crew} orang?\n\nStok akan otomatis berkurang.`
))return;

r.ingredients.forEach(i=>{

let need=scaleIngredient(i);

let s=stockFind(need[0]);

if(s){

let deduct=convertQty(
need[1],
need[2],
s.unit
);

if(deduct!==null){

s.qty=
Math.max(
0,
Number(s.qty)-deduct
);

}

}

});

save("v14_stock",stock);

let h={
id:Date.now(),
date:new Date().toLocaleString("id-ID"),
recipeId:r.id,
name:r.name,
crew:Number(crew)
};

history.push(h);

save("v15_history",history);

cookCount[r.name]=
(cookCount[r.name]||0)+1;

save("v15_cookCount",cookCount);

kitchenLog.push({
date:h.date,
text:`Memasak ${r.name} untuk ${crew} orang`
});

save("v15_log",kitchenLog);

alert(
"✅ Masakan berhasil dicatat.\n\n"+
"Stok otomatis dikurangi."
);

showPage("history");
}

let aa=recipeAvailability(a);
let bb=recipeAvailability(b);

if(recent.includes(a.id)){
aa-=25;
}

if(recent.includes(b.id)){
bb-=25;
}

return bb-aa;
});

let selected=[];
let used=new Set();

for(let i=0;i<7;i++){

let arr=
candidates.filter(r=>!used.has(r.id));

if(!arr.length){

used.clear();
arr=candidates;
}

let r=arr[0];

selected.push(r);
used.add(r.id);

}

function addStock(){

convertQty(

function getWeeklyRecipeIds(){

let ids=[];

weekly.forEach(w=>{

[
w.breakfast,

w.dinner
].forEach(id=>{

if(id){
ids.push(Number(id));
}

return ids;
}

function calculateShopping(){

let ids=getWeeklyRecipeIds();

let needed={};

ids.forEach(id=>{

let r=
recipes.find(x=>x.id===id);

if(!r)return;

r.ingredients.forEach(i=>{

let scaled=
scaleIngredient(i);

let name=scaled[0];
let qty=scaled[1];
let unit=scaled[2];

let key=norm(name);

if(!needed[key]){

needed[key]={
name,
qty:0,
unit
};

}

let same=
convertQty(
qty,
unit,
needed[key].unit
);

if(same!==null){

needed[key].qty+=same;

}

});

});

let result=[];

Object.values(needed).forEach(n=>{

let have=
stockAvailable(
n.name,
n.qty,
n.unit
);

let kurang=
Math.max(
0,
n.qty-have
);

if(kurang>0){

result.push({
name:n.name,
need:n.qty,
have,
buy:kurang,
unit:n.unit,
price:prices[n.name]||0
});

}

});

return result;
}

function estimatePrice(qty,unit,price){

/*
 Harga dianggap mengikuti satuan
 stok yang dimasukkan.

 Untuk kg/gram dan liter/ml,
 kita sesuaikan.
*/

let u=norm(unit);

if(u==="kg"){
return qty*price;
}

if(u==="liter"||u==="l"){
return qty*price;
}

if(u==="gram"||u==="g"){
return (qty/1000)*price;
}

if(u==="ml"){
return (qty/1000)*price;
}

return qty*price;
}

let key=norm(x.name);

shoppingChecked[key]=

"v15_shoppingChecked",
shoppingChecked
);

let items=
calculateShopping();

alert(
"Tidak ada bahan yang perlu dibeli."
);

return;
}

let text=
"🛒 DAFTAR BELANJA DAPUR KAPAL\n\n";

items.forEach((x,i)=>{

text+=
`${i+1}. ${x.name} — `+
`${formatQty(x.buy)} ${x.unit}`;

if(x.price){

text+=
` — Rp ${
estimatePrice(
x.buy,
x.unit,
x.price
).toLocaleString("id-ID")
}`;

}

text+="\n";

});

navigator.clipboard?.writeText(text)
.then(()=>{
alert("✅ Daftar belanja berhasil disalin.");
})
.catch(()=>{
alert(text);
});
}

function backupData(){

stock,
expenses,
tasks,
ratings,
crew,
dark,
dailyNote,
history,
cookCount,
kitchenLog,
prices,
shoppingChecked,
shoppingPlan
};

let blob=
new Blob(
[JSON.stringify(data,null,2)],

);

document.createElement("a");

URL.createObjectURL(blob);

a.download=
"backup-dapur-kapal-v15.2.json";

function restoreData(){

let file=
document.getElementById("restoreFile")
.files[0];

if(!file){

alert("Pilih file backup.");

return;
}

let reader=
new FileReader();

reader.onload=e=>{

try{

let d=
JSON.parse(e.target.result);

if(d.custom){
custom=d.custom;
save("v14_custom",custom);
}

if(d.weekly){
weekly=d.weekly;
save("v14_weekly",weekly);
}

if(d.stock){
stock=d.stock;
save("v14_stock",stock);
}

if(d.expenses){
expenses=d.expenses;
save("v14_expenses",expenses);
}

if(d.tasks){
tasks=d.tasks;
save("v14_tasks",tasks);
}

if(d.ratings){
ratings=d.ratings;
save("v14_ratings",ratings);
}

if(d.crew){
crew=d.crew;
save("v14_crew",crew);
}

if(d.dailyNote!==undefined){
dailyNote=d.dailyNote;
save("v14_dailyNote",dailyNote);
}

if(d.history){
history=d.history;
save("v15_history",history);
}

if(d.cookCount){
cookCount=d.cookCount;
save("v15_cookCount",cookCount);
}

if(d.kitchenLog){
kitchenLog=d.kitchenLog;
save("v15_log",kitchenLog);
}

if(d.prices){
prices=d.prices;
save("v15_prices",prices);
}

if(d.shoppingChecked){
shoppingChecked=d.shoppingChecked;
save(
"v15_shoppingChecked",
shoppingChecked
);
}

recipes=[
...defaultRecipes,
...custom
];

alert("✅ Backup berhasil dipulihkan.");

showPage("home");

}catch(err){

alert("❌ File backup tidak valid.");

}

};

reader.readAsText(file);
}
