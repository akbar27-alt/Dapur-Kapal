function get(key,def){
 try{
  const x=localStorage.getItem(key);
  return x?JSON.parse(x):def;
 }catch(e){return def}
}

function save(key,val){
 localStorage.setItem(key,JSON.stringify(val));
}

/* =========================
   UTIL
========================= */

function esc(s){
 return String(s).replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 }[m]));
}

function norm(s){
 return String(s).toLowerCase().trim();
}

function unitBase(q,u){
 u=norm(u);
 if(u==="kg")return {q:q*1000,u:"gram"};
 if(u==="g"||u==="gram"||u==="gram")return {q,u:"gram"};
 if(u==="liter"||u==="l")return {q:q*1000,u:"ml"};
 if(u==="ml")return {q,u:"ml"};
 return {q,u};
}

function compatible(a,b){
 let A=unitBase(1,a).u;
 let B=unitBase(1,b).u;
 return A===B;
}

function convertQty(q,from,to){
 let x=unitBase(q,from);
 let y=unitBase(1,to);
 if(x.u!==y.u)return null;
 return x.q/y.q;
}

function stockFind(name){
 return stock.find(x=>norm(x.name)===norm(name));
}

function stockAvailable(name,qty,unit){
 let s=stockFind(name);
 if(!s)return 0;
 let c=convertQty(Number(s.qty),s.unit,unit);
 return c===null?0:c;
}

function recipeAvailability(r){
 let total=r.ingredients.length;
 let good=0;

 r.ingredients.forEach(i=>{
  let have=stockAvailable(i[0],i[1],i[2]);
  if(have>=i[1])good++;
 });

 return total?Math.round(good/total*100):0;
}

function scaleIngredient(i){
 let factor=Number(crew)/9;
 return [i[0],i[1]*factor,i[2]];
}

function formatQty(q){
 if(Number.isInteger(q))return q;
 return Number(q.toFixed(2));
}

/* =========================
   COOK
========================= */

function cookRecipe(id){

 let r=recipes.find(x=>x.id===id);
 if(!r)return;

 let missing=[];

 r.ingredients.forEach(i=>{
  let need=scaleIngredient(i);
  let have=stockAvailable(i[0],need[1],need[2]);

  if(have<need[1]){
   missing.push(
    `${i[0]} kurang ${formatQty(need[1]-have)} ${i[2]}`
   );
  }
 });

 if(missing.length){
  alert(
   "⚠️ MENU BELUM BISA DIMASAK\n\n" +
   "Stok kurang:\n- "+missing.join("\n- ")
  );
  return;
 }

 if(!confirm(
  `Masak "${r.name}" untuk ${crew} orang?\n\n`+
  `Stok bahan akan otomatis dikurangi.`
 ))return;

 r.ingredients.forEach(i=>{
  let need=scaleIngredient(i);
  let s=stockFind(i[0]);

  if(s){
   let deduct=convertQty(need[1],need[2],s.unit);

   if(deduct!==null){
    s.qty=Number(s.qty)-deduct;
   }
  }
 });

 save("v14_stock",stock);

 let h={
  id:Date.now(),
  date:new Date().toLocaleString("id-ID"),
  recipeId:r.id,
  name:r.name,
  crew:Number(crew)
 };

 history.push(h);
 save("v15_history",history);

 cookCount[r.name]=(cookCount[r.name]||0)+1;
 save("v15_cookCount",cookCount);

 kitchenLog.push({
  date:h.date,
  text:`Memasak ${r.name} untuk ${crew} crew`
 });
 save("v15_log",kitchenLog);

 alert(
  "✅ MASAKAN TERCATAT!\n\n"+
  r.name+
  "\nStok bahan otomatis dikurangi."
 );

 showPage("history");
}

/* =========================
   SMART MENU
========================= */

function smartMenu(){

 let candidates=[...recipes];

 let recent=history.slice(-7).map(h=>h.recipeId);

 candidates.sort((a,b)=>{

  let aa=recipeAvailability(a);
  let bb=recipeAvailability(b);

  if(recent.includes(a.id))aa-=25;
  if(recent.includes(b.id))bb-=25;

  return bb-aa;
 });

 let selected=[];
 let used=new Set();

 for(let i=0;i<7;i++){

  let available=candidates.filter(r=>!used.has(r.id));

  if(!available.length){
   used.clear();
   available=candidates;
  }

  let r=available[0];

  selected.push(r);
  used.add(r.id);
 }

 let html=`

 <div class="card">
 <h2>🤖 Smart Menu 7 Hari</h2>
 <p>
 Menu dipilih berdasarkan stok dan mengurangi pengulangan
 menu yang baru dimasak.
 </p>

 ${selected.map((r,i)=>`

 <div class="day">
 <b>Hari ${i+1}</b><br>
 🍽️ ${esc(r.name)}<br>

 <span class="badge">
 Stok ${recipeAvailability(r)}%
 </span>

 <button class="success"
 onclick="cookRecipe(${r.id})">
 🍳 Masak
 </button>
 </div>

 `).join("")}

 <button class="primary" onclick="applySmartWeek(${selected.map(x=>x.id).join(",")})">
 📅 Masukkan ke Menu Mingguan
 </button>

 </div>
 `;

 document.getElementById("app").innerHTML=html;
}

function applySmartWeek(...ids){

 weekly=[];

 ids.forEach((id,i)=>{
  let r=recipes.find(x=>x.id===id);
  if(r){
   weekly.push({
    day:i+1,
    breakfast:r.category==="Sarapan"?r.id:null,
    lunch:r.category!=="Sarapan"?r.id:null,
    dinner:null
   });
  }
 });

 save("v14_weekly",weekly);

 alert("✅ Smart Menu dimasukkan ke menu mingguan.");

 renderMenu();
}

function renderMenu(){

 let days=[
  "Senin","Selasa","Rabu","Kamis",
  "Jumat","Sabtu","Minggu"
 ];

 document.getElementById("app").innerHTML=`

 <div class="card">
 <h2>📅 Menu Mingguan</h2>

 <button class="primary" onclick="smartMenu()">
 🤖 Buat Smart Menu
 </button>

 <button class="warning" onclick="randomWeek()">

 </button>

 ${days.map((d,i)=>{

  let w=weekly.find(x=>x.day===i+1)||{};

  return `
  <div class="day">
   <h3>${d}</h3>

   ${menuSelect("Sarapan",i,w.breakfast)}
   ${menuSelect("Makan Siang",i,w.lunch)}
   ${menuSelect("Makan Malam",i,w.dinner)}

 }).join("")}

 <button class="success" onclick="saveWeekly()">

 `;

function menuSelect(label,day,current){

 return `
 <label>${label}</label>
 <select id="menu_${day}_${label.replaceAll(" ","_")}">
 <option value="">-- Pilih Menu --</option>

 ${recipes.map(r=>`
 <option value="${r.id}"
 ${Number(current)===r.id?"selected":""}>
 ${esc(r.name)}
 </option>
 `).join("")}

 </select>
 `;
}

function saveWeekly(){

 weekly=[];

 for(let i=0;i<7;i++){

  let getv=l=>
   document.getElementById(
    `menu_${i}_${l.replaceAll(" ","_")}`
   )?.value||"";

  weekly.push({
   day:i+1,
   breakfast:Number(getv("Sarapan"))||null,
   lunch:Number(getv("Makan_Siang"))||null,
   dinner:Number(getv("Makan_Malam"))||null
  });
 }

 save("v14_weekly",weekly);

 alert("✅ Menu mingguan tersimpan.");
}

function randomWeek(){

 weekly=[];

 for(let i=1;i<=7;i++){

  let sarapan=recipes.filter(r=>r.category==="Sarapan");
  let makan=recipes.filter(r=>r.category!=="Sarapan");

  let b=sarapan[Math.floor(Math.random()*sarapan.length)];
  let l=makan[Math.floor(Math.random()*makan.length)];
  let d=makan[Math.floor(Math.random()*makan.length)];

  weekly.push({
   day:i,
   breakfast:b?.id||null,
   lunch:l?.id||null,
   dinner:d?.id||null
  });
 }

 save("v14_weekly",weekly);
 renderMenu();
}

function renderStock(){

 document.getElementById("app").innerHTML=`

 <div class="card">
 <h2>📦 Manajemen Stok</h2>

 <input id="stockName" placeholder="Nama bahan">

 <input id="stockQty"
 type="number"
 placeholder="Jumlah">

 <input id="stockUnit"
 placeholder="Satuan: kg, gram, liter, ml, butir">

 <input id="stockMin"
 type="number"
 placeholder="Batas minimum">

 <button class="primary" onclick="addStock()">
 ➕ Tambah Stok
 </button>
 </div>

 <div class="card">
 <h3>📦 Daftar Stok</h3>

 ${stock.length?stock.map((s,i)=>`

 <div class="ingredient">
 <b>${esc(s.name)}</b><br>

 ${s.qty} ${esc(s.unit)}

 ${Number(s.qty)<=Number(s.min||0)
 ?`<span class="badge low">⚠️ MENIPIS</span>`
 :`<span class="badge good">AMAN</span>`}

 <br><small>
 Minimum: ${s.min||0} ${esc(s.unit)}
 </small>

 <br><br>

 <button onclick="changeStock(${i},1)">➕</button>
 <button onclick="changeStock(${i},-1)">➖</button>
 <button class="danger" onclick="deleteStock(${i})">
 Hapus
 </button>
 </div>

 `).join("")
 :"<p>Belum ada stok.</p>"}

 </div>
 `;
}

function addStock(){

 let name=document.getElementById("stockName").value.trim();
 let qty=Number(document.getElementById("stockQty").value);
 let unit=document.getElementById("stockUnit").value.trim();
 let min=Number(document.getElementById("stockMin").value)||0;

 if(!name||!qty||!unit){
  alert("Lengkapi nama, jumlah dan satuan.");
  return;
 }

 let old=stockFind(name);

 if(old){
  let add=convertQty(qty,unit,old.unit);

  if(add===null){
   alert("❌ Satuan tidak cocok dengan stok lama.");
   return;
  }

  old.qty=Number(old.qty)+add;
  old.min=min||old.min;
 }else{
  stock.push({name,qty,unit,min});
 }

 save("v14_stock",stock);
 renderStock();
}

function changeStock(i,n){

 stock[i].qty=Math.max(
  0,
  Number(stock[i].qty)+n
 );

 save("v14_stock",stock);
 renderStock();
}

function deleteStock(i){

 if(confirm("Hapus stok ini?")){
  stock.splice(i,1);
  save("v14_stock",stock);
  renderStock();
 }
}

function addRecipe(){

 let name=document.getElementById("newName").value.trim();
 let category=document.getElementById("newCat").value;
 let ing=document.getElementById("newIng").value.trim();
 let steps=document.getElementById("newSteps").value.trim();

 if(!name||!ing||!steps){
  alert("Lengkapi data resep.");
  return;
 }

 let ingredients=ing.split("\n")
 .map(x=>x.split("|"))
 .filter(x=>x.length>=3)
 .map(x=>[
  x[0].trim(),
  Number(x[1]),
  x[2].trim()
 ]);

 let r={
  id:Date.now(),
  name,
  category,
  servings:9,
  ingredients,
  steps:steps.split("\n").filter(Boolean),
  tip:"Sesuaikan rasa dengan kondisi bahan dan jumlah crew."
 };

 custom.push(r);
 recipes=[...defaultRecipes,...custom];

 save("v14_custom",custom);

 alert("✅ Resep berhasil ditambahkan.");

 renderRecipes();
}

/* =========================
   BACKUP
========================= */

function backupData(){

 let data={
  custom,
  weekly,
  stock,
  expenses,
  tasks,
  ratings,
  crew,
  dark,
  dailyNote,
  history,
  cookCount,
  kitchenLog
 };

 let blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 let a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="backup-dapur-kapal-v15.json";
 a.click();
}

function restoreData(){

 let file=document.getElementById("restoreFile").files[0];

 if(!file){
  alert("Pilih file backup terlebih dahulu.");
  return;
 }

 let reader=new FileReader();

 reader.onload=e=>{

  try{

   let d=JSON.parse(e.target.result);

   if(d.custom){
    custom=d.custom;
    save("v14_custom",custom);
   }

   if(d.weekly){
    weekly=d.weekly;
    save("v14_weekly",weekly);
   }

   if(d.stock){
    stock=d.stock;
    save("v14_stock",stock);
   }

   if(d.expenses){
    expenses=d.expenses;
    save("v14_expenses",expenses);
   }

   if(d.tasks){
    tasks=d.tasks;
    save("v14_tasks",tasks);
   }

   if(d.ratings){
    ratings=d.ratings;
    save("v14_ratings",ratings);
   }

   if(d.crew){
    crew=d.crew;
    save("v14_crew",crew);
   }

   if(d.dailyNote!==undefined){
    dailyNote=d.dailyNote;
    save("v14_dailyNote",dailyNote);
   }

   if(d.history){
    history=d.history;
    save("v15_history",history);
   }

   if(d.cookCount){
    cookCount=d.cookCount;
    save("v15_cookCount",cookCount);
   }

   if(d.kitchenLog){
    kitchenLog=d.kitchenLog;
    save("v15_log",kitchenLog);
   }

   recipes=[...defaultRecipes,...custom];

   alert("✅ Backup berhasil dipulihkan.");
   showPage("home");

  }catch(err){
   alert("❌ File backup tidak valid.");
  }
 };

 reader.readAsText(file);
}

/* =========================
   CHEF MODE
========================= */

function chefMode(){

 let r=recipes[Math.floor(Math.random()*recipes.length)];

 let seconds=15*60;
 let timer=null;

 document.getElementById("app").innerHTML=`

 <div class="card">
 <h2>👨‍🍳 MODE CHEF</h2>

 <h3>${esc(r.name)}</h3>

 <div class="stat">
  <b id="timer">15:00</b>
  Timer
 </div>

 <br>

 <button class="success" onclick="startTimer()">
 ▶️ Mulai Timer
 </button>

 <button class="warning" onclick="stopTimer()">
 ⏸️ Stop
 </button>

 <button onclick="detailRecipe(${r.id})">
 👀 Lihat Resep
 </button>

 <hr>

 <h3>Langkah Masak</h3>

 <ol>
 ${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}
 </ol>

 </div>
 `;

 window.startTimer=function(){

  if(timer)return;

  timer=setInterval(()=>{

   seconds--;

   let m=Math.floor(seconds/60);
   let s=seconds%60;

   document.getElementById("timer").textContent=
    `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

   if(seconds<=0){
    clearInterval(timer);
    timer=null;
    alert("⏰ TIMER SELESAI!");
   }

  },1000);
 };

 window.stopTimer=function(){

  clearInterval(timer);
  timer=null;
 };
}
