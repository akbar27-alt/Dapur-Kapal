<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dapur Kapal V13</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f9;
  color:#17202a;
}
body.dark{
  background:#101820;
  color:#f1f5f9;
}
header{
  background:linear-gradient(135deg,#075985,#0f766e);
  color:white;
  padding:20px 15px;
  position:sticky;
  top:0;
  z-index:20;
}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;opacity:.9}
.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}
.dark .card{
  background:#1b2730;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
.stat{
  padding:15px;
  border-radius:14px;
  background:#e0f2fe;
}
.dark .stat{background:#24343f}
.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}
button,input,select,textarea{
  font:inherit;
}
button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  cursor:pointer;
  background:#0f766e;
  color:white;
  margin:3px;
}
button.secondary{background:#475569}
button.danger{background:#dc2626}
button.warning{background:#d97706}
button.blue{background:#0369a1}
input,select,textarea{
  width:100%;
  padding:10px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  margin:5px 0 10px;
  background:white;
  color:#111827;
}
.dark input,.dark select,.dark textarea{
  background:#26343d;
  color:white;
  border-color:#475569;
}
label{
  font-weight:bold;
  font-size:14px;
}
.recipe{
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
}
.dark .recipe{border-color:#475569}
.recipe h3{margin:0 0 5px}
.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  background:#dbeafe;
  color:#1e40af;
  font-size:12px;
  margin:2px;
}
.dark .badge{
  background:#164e63;
  color:#bae6fd;
}
.day{
  border:1px solid #cbd5e1;
  border-radius:15px;
  padding:12px;
  margin-bottom:12px;
}
.dark .day{border-color:#475569}
.slot{
  padding:10px;
  border-radius:10px;
  background:#f8fafc;
  margin:7px 0;
}
.dark .slot{background:#25323b}
.slot-title{
  font-weight:bold;
  margin-bottom:5px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  padding:15px;
  overflow:auto;
}
.modal-box{
  max-width:750px;
  margin:30px auto;
  background:white;
  border-radius:18px;
  padding:20px;
}
.dark .modal-box{
  background:#17232b;
}
.close{
  float:right;
  background:#dc2626;
}
.steps li{
  margin-bottom:10px;
}
.progress{
  height:10px;
  background:#e2e8f0;
  border-radius:10px;
  overflow:hidden;
}
.progress div{
  height:100%;
  background:#0f766e;
  width:0%;
}
.small{
  font-size:13px;
  opacity:.8;
}
.hidden{display:none}
hr{
  border:0;
  border-top:1px solid #ddd;
  margin:15px 0;
}
@media(max-width:600px){
  header h1{font-size:21px}
  .container{padding:10px}
  button{font-size:13px}
}
</style>
</head>

<body>

<header>
  <h1>🚢 Dapur Kapal V13</h1>
  <p>Asisten dapur untuk menu, resep, stok & belanja kapal</p>
</header>

<div class="container">

<!-- DASHBOARD -->
<div class="card">
  <h2>📊 Dashboard</h2>

  <div class="grid">
    <div class="stat">
      👨‍✈️ Kru
      <b id="crewStat">9</b>
    </div>

    <div class="stat">
      🍳 Resep
      <b id="recipeStat">0</b>
    </div>

    <div class="stat">
      ⭐ Favorit
      <b id="favStat">0</b>
    </div>

    <div class="stat">
      📦 Stok
      <b id="stockStat">0</b>
    </div>
  </div>

  <label>Jumlah Kru</label>
  <input type="number" id="crew" min="1" value="9" onchange="saveCrew()">

  <button onclick="toggleDark()">🌙 Mode Gelap</button>
  <button class="blue" onclick="generateMenu()">🎲 Buat Menu Otomatis</button>
</div>


<!-- SEARCH -->
<div class="card">
  <h2>🔎 Cari Resep</h2>

  <input
    id="search"
    placeholder="Contoh: ayam, ikan, nasi..."
    oninput="renderRecipes()"
  >

  <select id="category" onchange="renderRecipes()">
    <option value="">Semua Kategori</option>
    <option value="Sarapan">🌅 Sarapan</option>
    <option value="Ikan">🐟 Ikan</option>
    <option value="Ayam">🍗 Ayam</option>
    <option value="Praktis">🍜 Praktis</option>
    <option value="Tempe">🥢 Tempe/Tahu</option>
    <option value="Telur">🥚 Telur</option>
    <option value="Lainnya">🍛 Lainnya</option>
  </select>

  <button onclick="openAddRecipe()">➕ Tambah Resep</button>
</div>


<!-- RESEP -->
<div class="card">
  <h2>🍳 Koleksi Resep</h2>
  <div id="recipes"></div>
</div>


<!-- MENU MINGGUAN -->
<div class="card">
  <h2>📅 Menu 7 Hari</h2>

  <button onclick="generateMenu()">🎲 Generate Otomatis</button>
  <button class="secondary" onclick="clearMenu()">🗑️ Kosongkan</button>

  <div id="weekly"></div>

  <button class="blue" onclick="showShopping()">🛒 Buat Daftar Belanja</button>
  <button class="warning" onclick="showReport()">📊 Laporan Mingguan</button>
</div>


<!-- STOK -->
<div class="card">
  <h2>📦 Stok Bahan Kapal</h2>

  <input id="stockName" placeholder="Nama bahan, contoh: Beras">
  <input id="stockQty" type="number" placeholder="Jumlah stok">
  <input id="stockUnit" placeholder="Satuan, contoh: kg">
  <button onclick="addStock()">➕ Tambah Stok</button>

  <div id="stockList"></div>
</div>


<!-- HARGA -->
<div class="card">
  <h2>💰 Harga Bahan</h2>

  <p class="small">
    Masukkan harga bahan untuk menghitung perkiraan biaya menu mingguan.
  </p>

  <div id="priceList"></div>
</div>


<!-- MODAL RESEP -->
<div class="modal" id="recipeModal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('recipeModal')">✕</button>
    <div id="recipeDetail"></div>
  </div>
</div>


<!-- MODAL CHEF -->
<div class="modal" id="chefModal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('chefModal')">✕</button>
    <div id="chefContent"></div>
  </div>
</div>


<!-- MODAL ADD -->
<div class="modal" id="addModal">
  <div class="modal-box">

    <button class="close" onclick="closeModal('addModal')">✕</button>

    <h2>➕ Tambah Resep</h2>

    <label>Nama Resep</label>
    <input id="newName">

    <label>Kategori</label>
    <select id="newCategory">
      <option>Sarapan</option>
      <option>Ikan</option>
      <option>Ayam</option>
      <option>Praktis</option>
      <option>Tempe</option>
      <option>Telur</option>
      <option>Lainnya</option>
    </select>

    <label>Bahan</label>
    <textarea id="newIngredients" rows="6"
      placeholder="Contoh:
Ikan 1 kg
Bawang merah 8 siung
Cabai 10 buah"></textarea>

    <label>Langkah memasak</label>
    <textarea id="newSteps" rows="8"
      placeholder="1. Bersihkan bahan.
2. Tumis bumbu.
3. Masukkan bahan utama.
4. Masak sampai matang."></textarea>

    <button onclick="saveCustomRecipe()">💾 Simpan Resep</button>

  </div>
</div>


<!-- MODAL SHOPPING -->
<div class="modal" id="shoppingModal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('shoppingModal')">✕</button>
    <div id="shoppingContent"></div>
  </div>
</div>


<!-- MODAL REPORT -->
<div class="modal" id="reportModal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('reportModal')">✕</button>
    <div id="reportContent"></div>
    <button onclick="window.print()">🖨️ Cetak</button>
  </div>
</div>

</div>

let customRecipes=load("dapurKapalCustomV13",[]);
let favorites=load("dapurKapalFavoritesV13",[]);
let shopping=load("dapurKapalShoppingV13",{});
let weekly=load("dapurKapalWeeklyMenuV13",{});
let stock=load("dapurKapalStockV13",[]);
let prices=load("dapurKapalPricesV13",{});
let crew=Number(localStorage.getItem("dapurKapalCrewV13"))||9;
let dark=localStorage.getItem("dapurKapalDarkV13")==="1";

document.getElementById("crew").value=crew;

if(dark) document.body.classList.add("dark");


function load(key,fallback){
  try{
    const x=localStorage.getItem(key);
    return x?JSON.parse(x):fallback;
  }catch(e){
    return fallback;
  }
}


function save(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}


function allRecipes(){
  return [...recipes,...customRecipes];
}


function saveCrew(){
  crew=Math.max(1,Number(document.getElementById("crew").value)||9);
  localStorage.setItem("dapurKapalCrewV13",crew);
  renderAll();
}


function toggleDark(){
  dark=!dark;
  document.body.classList.toggle("dark",dark);
  localStorage.setItem("dapurKapalDarkV13",dark?"1":"0");
}


function renderRecipes(){

  const q=(document.getElementById("search").value||"").toLowerCase();
  const cat=document.getElementById("category").value;

  let list=allRecipes().filter(r=>{
    const matchText=
      r.name.toLowerCase().includes(q) ||
      r.category.toLowerCase().includes(q);

    const matchCat=!cat || r.category===cat;

    return matchText && matchCat;
  });

  document.getElementById("recipes").innerHTML=list.map(r=>{

    const fav=favorites.includes(r.id);

    return `
      <div class="recipe">
        <h3>${fav?"⭐ ":""}${r.name}</h3>

        <span class="badge">${r.category}</span>
        <span class="badge">${r.servings} orang</span>

        <p class="small">
          ⏱️ ${r.prep} persiapan · ${r.cook} memasak
        </p>

        <button onclick="viewRecipe(${r.id})">👀 Lihat</button>
        <button class="blue" onclick="chefMode(${r.id})">👨‍🍳 Chef</button>
        <button onclick="toggleFavorite(${r.id})">
          ${fav?"💔 Hapus Favorit":"⭐ Favorit"}
        </button>

        ${
          r.id>1000
          ? `<button class="danger" onclick="deleteRecipe(${r.id})">🗑️ Hapus</button>`
          :""
        }
      </div>
    `;
  }).join("");

  updateStats();
}


function findRecipe(id){
  return allRecipes().find(r=>Number(r.id)===Number(id));
}


function scaleIngredient(item,r){

  const factor=crew/r.servings;

  const amount=Number(item[1])*factor;

  let text=amount;

  if(Number.isInteger(amount)){
    text=amount;
  }else{
    text=amount.toFixed(2).replace(/\.?0+$/,"");
  }

  return `${text} ${item[2]} ${item[0]}`;
}


function viewRecipe(id){

  const r=findRecipe(id);

  if(!r)return;

  const note=localStorage.getItem("dapurKapalNote_"+id)||"";

  document.getElementById("recipeDetail").innerHTML=`

    <h2>${r.name}</h2>

    <span class="badge">${r.category}</span>

    <p>
      👨‍✈️ Porsi: <b>${crew} orang</b><br>
      🔥 Api: ${r.fire}<br>
      ⏱️ Persiapan: ${r.prep}<br>
      ⏱️ Masak: ${r.cook}
    </p>

    <hr>

    <h3>🛒 Bahan</h3>

    <ul>
      ${r.ingredients.map(x=>`
        <li>${scaleIngredient(x,r)}</li>
      `).join("")}
    </ul>

    <h3>👨‍🍳 Cara Memasak</h3>

    <ol class="steps">
      ${r.steps.map(x=>`<li>${x}</li>`).join("")}
    </ol>

    <h3>✅ Tanda Matang</h3>
    <p>${r.done||"Pastikan bahan matang sempurna."}</p>

    <h3>🚢 Tips Dapur Kapal</h3>
    <p>${r.tip||"Masak dengan aman dan sesuaikan kondisi kapal."}</p>

    <hr>

    <h3>📝 Catatan</h3>

    <textarea
      id="recipeNote"
      rows="4"
      placeholder="Contoh: kru kurang suka pedas..."
    >${note}</textarea>

    <button onclick="saveNote(${id})">💾 Simpan Catatan</button>

  `;

  document.getElementById("recipeModal").style.display="block";
}


function saveNote(id){

  const note=document.getElementById("recipeNote").value;

  localStorage.setItem("dapurKapalNote_"+id,note);

  alert("Catatan disimpan 👍");
}


function chefMode(id){

  const r=findRecipe(id);

  if(!r)return;

  let current=0;

  function render(){

    const total=r.steps.length;
    const progress=((current+1)/total)*100;

    document.getElementById("chefContent").innerHTML=`

      <h2>👨‍🍳 Mode Chef</h2>

      <h3>${r.name}</h3>

      <p>
        Langkah <b>${current+1}</b> dari ${total}
      </p>

      <div class="progress">
        <div style="width:${progress}%"></div>
      </div>

      <div class="card">
        <h2>${r.steps[current]}</h2>
      </div>

      <button
        ${current===0?"disabled":""}
        onclick="chefBack()">
        ⬅️ Sebelumnya
      </button>

      <button onclick="chefNext()">
        ${current===total-1?"✅ Selesai":"➡️ Berikutnya"}
      </button>

      <hr>

      <h3>⏱️ Timer</h3>

      <input id="timerMinutes" type="number" value="5" min="1">

      <button onclick="startTimer()">▶️ Mulai Timer</button>

      <h2 id="timerDisplay">05:00</h2>
    `;

    window.currentChefStep=current;
    window.currentChefRecipe=id;
  }

  window.chefBack=function(){
    if(current>0){
      current--;
      render();
    }
  };

  window.chefNext=function(){
    if(current<r.steps.length-1){
      current++;
      render();
    }else{
      alert("Masakan selesai! 🔥");
    }
  };

  render();

  document.getElementById("chefModal").style.display="block";
}


let timerInterval=null;
let timerSeconds=0;


function startTimer(){

  clearInterval(timerInterval);

  let minutes=Number(document.getElementById("timerMinutes").value)||5;

  timerSeconds=minutes*60;

  timerInterval=setInterval(()=>{

    timerSeconds--;

    const m=Math.floor(timerSeconds/60);
    const s=timerSeconds%60;

    const el=document.getElementById("timerDisplay");

    if(el){
      el.textContent=
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");
    }

    if(timerSeconds<=0){
      clearInterval(timerInterval);
      alert("⏰ TIMER SELESAI!");
    }

  },1000);
}


function toggleFavorite(id){

  id=Number(id);

  if(favorites.includes(id)){
    favorites=favorites.filter(x=>x!==id);
  }else{
    favorites.push(id);
  }

  save("dapurKapalFavoritesV13",favorites);

  renderRecipes();
}


function openAddRecipe(){
  document.getElementById("addModal").style.display="block";
}


function saveCustomRecipe(){

  const name=document.getElementById("newName").value.trim();

  if(!name){
    alert("Nama resep belum diisi.");
    return;
  }

  const ingredientText=
    document.getElementById("newIngredients").value.trim();

  const stepsText=
    document.getElementById("newSteps").value.trim();

  const ingredients=ingredientText
    .split("\n")
    .filter(Boolean)
    .map(line=>{

      const parts=line.trim().split(/\s+/);

      const amount=Number(parts[1])||1;

      return [
        parts.slice(2).join(" ")||parts[0],
        amount,
        parts[1] && isNaN(parts[1])?"":(parts[2]||"buah")
      ];

    });

  const steps=stepsText
    .split("\n")
    .map(x=>x.replace(/^\d+\.\s*/,""))
    .filter(Boolean);

  const recipe={
    id:Date.now(),
    name,
    category:document.getElementById("newCategory").value,
    servings:9,
    ingredients,
    steps,
    prep:"10 menit",
    cook:"20 menit",
    fire:"Sedang",
    done:"Pastikan matang sempurna.",
    tip:"Sesuaikan dengan kondisi dapur kapal."
  };

  customRecipes.push(recipe);

  save("dapurKapalCustomV13",customRecipes);

  closeModal("addModal");

  document.getElementById("newName").value="";
  document.getElementById("newIngredients").value="";
  document.getElementById("newSteps").value="";

  renderAll();

  alert("Resep berhasil ditambahkan 👍");
}


function deleteRecipe(id){

  if(!confirm("Hapus resep ini?"))return;

  customRecipes=
    customRecipes.filter(r=>Number(r.id)!==Number(id));

  save("dapurKapalCustomV13",customRecipes);

  renderAll();
}


function normalizeWeekly(){

  DAYS.forEach(day=>{

    if(!weekly[day]){
      weekly[day]={
        breakfast:"",
        lunch:"",
        dinner:""
      };
    }

    if(typeof weekly[day]!=="object"){
      weekly[day]={
        breakfast:"",
        lunch:weekly[day]||"",
        dinner:""
      };
    }

  });

  save("dapurKapalWeeklyMenuV13",weekly);
}


function renderWeekly(){

  normalizeWeekly();

  const list=allRecipes();

  document.getElementById("weekly").innerHTML=
    DAYS.map(day=>{

      return `
        <div class="day">

          <h3>📅 ${day}</h3>

          ${SLOTS.map(slot=>{

            const selected=weekly[day][slot.key]||"";

            return `
              <div class="slot">

                <div class="slot-title">
                  ${slot.name}
                </div>

                <select
                  onchange="setMenu('${day}','${slot.key}',this.value)"
                >

                  <option value="">-- Pilih menu --</option>

                  ${list.map(r=>`
                    <option
                      value="${r.id}"
                      ${String(selected)===String(r.id)?"selected":""}
                    >
                      ${r.name}
                    </option>
                  `).join("")}

                </select>

              </div>
            `;

          }).join("")}

        </div>
      `;

    }).join("");
}


function setMenu(day,slot,id){

  weekly[day][slot]=id;

  save("dapurKapalWeeklyMenuV13",weekly);

  renderWeekly();
}


function randomRecipe(category){

  let list=allRecipes();

  if(category){
    const filtered=list.filter(r=>r.category===category);

    if(filtered.length)list=filtered;
  }

  return list[Math.floor(Math.random()*list.length)];
}


function generateMenu(){

  const breakfast=
    allRecipes().filter(r=>r.category==="Sarapan");

  const normal=
    allRecipes().filter(r=>
      r.category!=="Sarapan"
    );

  DAYS.forEach(day=>{

    let b=breakfast.length
      ? breakfast[Math.floor(Math.random()*breakfast.length)]
      : randomRecipe();

    let l=normal[Math.floor(Math.random()*normal.length)];

    let d=normal[Math.floor(Math.random()*normal.length)];

    weekly[day]={
      breakfast:b.id,
      lunch:l.id,
      dinner:d.id
    };

  });

  save("dapurKapalWeeklyMenuV13",weekly);

  renderWeekly();

  alert("Menu 7 hari berhasil dibuat 🎲");
}


function clearMenu(){

  if(!confirm("Kosongkan semua menu minggu ini?"))return;

  weekly={};

  normalizeWeekly();

  renderWeekly();
}


function addStock(){

  const name=document.getElementById("stockName").value.trim();
  const qty=Number(document.getElementById("stockQty").value);
  const unit=document.getElementById("stockUnit").value.trim();

  if(!name||!qty){
    alert("Isi nama dan jumlah stok.");
    return;
  }

  stock.push({
    id:Date.now(),
    name,
    qty,
    unit
  });

  save("dapurKapalStockV13",stock);

  document.getElementById("stockName").value="";
  document.getElementById("stockQty").value="";
  document.getElementById("stockUnit").value="";

  renderStock();
}


function renderStock(){

  const el=document.getElementById("stockList");

  if(!stock.length){
    el.innerHTML="<p>Belum ada stok.</p>";
    return;
  }

  el.innerHTML=stock.map(s=>`

    <div class="recipe">

      <b>${s.name}</b>

      <p>
        Stok: ${s.qty} ${s.unit}
      </p>

      <button
        onclick="changeStock(${s.id},1)">
        ➕
      </button>

      <button
        class="secondary"
        onclick="changeStock(${s.id},-1)">
        ➖
      </button>

      <button
        class="danger"
        onclick="deleteStock(${s.id})">
        🗑️
      </button>

    </div>

  `).join("");
}


function changeStock(id,value){

  const s=stock.find(x=>x.id===id);

  if(!s)return;

  s.qty=Math.max(0,s.qty+value);

  save("dapurKapalStockV13",stock);

  renderStock();
}


function deleteStock(id){

  stock=stock.filter(s=>s.id!==id);

  save("dapurKapalStockV13",stock);

  renderStock();
}


function collectWeeklyIngredients(){

  const totals={};

  DAYS.forEach(day=>{

    SLOTS.forEach(slot=>{

      const id=weekly[day][slot.key];

      if(!id)return;

      const r=findRecipe(id);

      if(!r)return;

      r.ingredients.forEach(item=>{

        const name=item[0].toLowerCase();
        const amount=
          Number(item[1])*
          crew/
          r.servings;

        const unit=item[2];

        const key=name+"|"+unit;

        if(!totals[key]){
          totals[key]={
            name:item[0],
            qty:0,
            unit
          };
        }

        totals[key].qty+=amount;

      });

    });

  });

  return Object.values(totals);
}


function showShopping(){

  const items=collectWeeklyIngredients();

  document.getElementById("shoppingContent").innerHTML=`

    <h2>🛒 Daftar Belanja 7 Hari</h2>

    <p>
      Untuk <b>${crew} kru</b>
    </p>

    <ul>
      ${items.map(x=>`
        <li>
          <b>${x.name}</b> —
          ${x.qty.toFixed(2)} ${x.unit}
        </li>
      `).join("")}
    </ul>

    ${
      !items.length
      ? "<p>Belum ada menu mingguan.</p>"
      :""
    }

  `;

  document.getElementById("shoppingModal").style.display="block";
}


function showReport(){

  const items=collectWeeklyIngredients();

  let totalCost=0;

  const rows=items.map(x=>{

    const key=x.name.toLowerCase();

    const price=Number(prices[key])||0;

    const cost=price*x.qty;

    totalCost+=cost;

    return `
      <tr>
        <td>${x.name}</td>
        <td>${x.qty.toFixed(2)} ${x.unit}</td>
        <td>Rp ${formatMoney(price)}</td>
        <td>Rp ${formatMoney(cost)}</td>
      </tr>
    `;

  }).join("");

  const menuRows=DAYS.map(day=>{

    const b=findRecipe(weekly[day].breakfast);
    const l=findRecipe(weekly[day].lunch);
    const d=findRecipe(weekly[day].dinner);

    return `
      <tr>
        <td>${day}</td>
        <td>${b?b.name:"-"}</td>
        <td>${l?l.name:"-"}</td>
        <td>${d?d.name:"-"}</td>
      </tr>
    `;

  }).join("");

  document.getElementById("reportContent").innerHTML=`

    <h2>📊 Laporan Dapur Kapal</h2>

    <p>
      Jumlah kru: <b>${crew}</b><br>
      Perkiraan belanja:
      <b>Rp ${formatMoney(totalCost)}</b>
    </p>

    <h3>📅 Menu Mingguan</h3>

    <table border="1" cellpadding="7" width="100%">
      <tr>
        <th>Hari</th>
        <th>Sarapan</th>
        <th>Siang</th>
        <th>Malam</th>
      </tr>
      ${menuRows}
    </table>

    <h3>🛒 Kebutuhan Bahan</h3>

    <table border="1" cellpadding="7" width="100%">
      <tr>
        <th>Bahan</th>
        <th>Kebutuhan</th>
        <th>Harga/unit</th>
        <th>Perkiraan</th>
      </tr>
      ${rows}
    </table>

  `;

  document.getElementById("reportModal").style.display="block";
}


function formatMoney(n){
  return Math.round(n).toLocaleString("id-ID");
}


function renderPrices(){

  const items=collectWeeklyIngredients();

  document.getElementById("priceList").innerHTML=
    items.map(x=>{

      const key=x.name.toLowerCase();

      return `
        <label>${x.name}</label>

        <input
          type="number"
          placeholder="Harga per ${x.unit}"
          value="${prices[key]||""}"
          onchange="setPrice('${key}',this.value)"
        >
      `;

    }).join("");

  if(!items.length){
    document.getElementById("priceList").innerHTML=
      "<p>Buat menu mingguan terlebih dahulu.</p>";
  }
}


function setPrice(key,value){

  prices[key]=Number(value)||0;

  save("dapurKapalPricesV13",prices);
}


function updateStats(){

  document.getElementById("crewStat").textContent=crew;
  document.getElementById("recipeStat").textContent=allRecipes().length;
  document.getElementById("favStat").textContent=favorites.length;
  document.getElementById("stockStat").textContent=stock.length;
}


function closeModal(id){
  document.getElementById(id).style.display="none";
}


function renderAll(){

  renderRecipes();
  renderWeekly();
  renderStock();
  renderPrices();
  updateStats();

}


renderAll();

</script>

</body>
</html>
